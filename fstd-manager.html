S 53 kt, Stall IAS 52 kt\n- FLAP Take Off: Stall warning IAS 48 kt, Stall IAS 43 kt\n- FLAP LAND: Stall warning IAS 39 kt, Stall IAS 39 kt.\n\nThis same defect was already detected during the previous evaluation, and it was assumed to have been corrected based on the evidence submitted. It has malfunctioned again.\n\nAccording to MQTG test 2c(8b)1, performed at a weight of 2,300 lb and an altitude of 4,200 ft with Flaps UP, the Stall Warning activates at a CAS of 59 kt and the minimum speed reached is CAS 52 kt.\n\nAccording to MQTG test 2c(8b)2, performed at a weight of 2,300 lb and an altitude of 4,100 ft with Flaps T/O, the Stall Warning activates at a CAS of 56 kt and the minimum speed reached is CAS 45 kt.", "resolution": "A technical incident will be opened with the simulator manufacturer, providing the results obtained during the evaluation and reference to the requirements established in the applicable MQTG tests.\n\nThe manufacturer must analyze the configuration and parameterization of the stall-warning system, and review the modifications implemented during previous work related to correcting the QTG, in order to identify the origin of the discrepancy.\n\nOnce the technical cause is determined, the necessary corrections will be implemented and new functional and subjective tests will be carried out to verify that the Stall Warning activates with the anticipation required in all applicable flight configurations and within the tolerances established by the MQTG.\n\nAfter the intervention, the results of the verifications performed will be documented."}, {"id": "find_msra8hid67sxgh", "seq": 14, "title": "SUB.B4 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — i.1 Control forces corresponding to the replicated aircraft type", "category": "Hardware", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The force required to move the Roll control appears higher than would be expected for this type of aircraft, directly affecting control precision and pilot workload. Although according to the recurrent QTG 2a(2), the result matches the MQTG.", "resolution": "QTG test 2.a.(2), corresponding to the aileron control force, will be repeated on each affected simulator. Additionally, an independent manual measurement will be carried out using a dynamometer, verifying at least the force required to reach maximum deflection of the aileron control. The values obtained through manual measurement will be compared with the results recorded by the automatic QTG test, in order to validate the accuracy of the simulator's measurements and confirm that the control forces fall within acceptable tolerances.\n\nDepending on the results obtained: if the difference between both measurements is minimal and compatible with the established tolerances, closure will proceed. If significant deviations are detected, a technical incident will be opened with the manufacturer to investigate the origin of the problem."}, {"id": "find_msrab8bwvvmnyk", "seq": 15, "title": "SUB.B5 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — a.6 Representative secondary flight controls", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "It is observed that, with the control column fully in the \"Nose Down\" position, the pitch trim, both in cruise flight and even during the final approach and landing phase with flaps in LAND configuration and low speed, despite the CG (Center of Gravity) being fairly forward (approximately 11%), continues to require significant nose-up force and it is impossible to keep it trimmed. In a landing configuration, even with the pitch control trim in the extreme \"Nose Down\" position, the aircraft still has a slight tendency to raise the nose and it is impossible to keep it trimmed.", "resolution": "The incident will be formally reported to the simulator manufacturer. Once the origin of the discrepancy has been identified, the manufacturer must implement the necessary corrections. Functional and subjective tests will subsequently be carried out to verify that the trim system allows the aircraft to be correctly trimmed in all normal flight configurations and within the expected center-of-gravity ranges."}, {"id": "find_msrabyp1vqf707", "seq": 16, "title": "SUB.B6 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — c.1 Flight dynamics model with correct center-of-gravity effects, among others", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "Strange behavior is observed in the variation of the Center of Gravity with weight. It is observed that as the aircraft is loaded from the rear, the center of gravity moves forward.\n\n- With >80% fuel in each tank, 1 pilot + 1 front passenger: Gross W = 2149.2 lbs, cg = 19.8% MAC\n- With >80% fuel in each tank, 1 pilot + 1 front + 1 rear passenger: Gross W = 2325.6 lbs, cg = 15.3% MAC\n- With >80% fuel in each tank, 1 pilot + 1 front + 2 rear passengers: Gross W = 2502.0 lbs, cg = 11.1% MAC", "resolution": "The incident will be formally communicated to the simulator manufacturer. A complete review of the algorithms will be requested. Once the technical cause has been identified, the manufacturer must implement the necessary corrections. New subjective tests will subsequently be carried out with different loading and fuel configurations to verify that the Center of Gravity variations respond consistently to the aircraft's mass distribution and are consistent with the reference documentation."}, {"id": "find_msrad1rft2uoge", "seq": 17, "title": "SUB.B7 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — c.1 Flight dynamics model with correct temperature effects, among others", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "When performing the VOR approach to runway 01 at GCFV-Fuerteventura, with a temperature of -30ºC (ISA -45º) and QNH 1013, consistent with what was selected on the IOS, and flying the approach precisely to the DME-vs-Altitude table published on the instrument approach chart, without applying a correction for low temperature, the PAPI indication is at all times two white lights and two red lights, meaning that the aircraft is on a correct 3° geometric glidepath. \n\nHowever, it would be expected that the PAPI indication would show that the aircraft is flying closer to the ground than the 3° geometric glidepath at all times, given how cold the atmosphere is and given that the cold-atmosphere correction to the altitude indicated on the altimeter was not applied.", "resolution": "A technical inquiry will be opened with the simulator manufacturer to determine whether the modelling of cold-temperature effects on true altitude and visual approach aids is implemented in accordance with applicable requirements.\n\nThe manufacturer must analyze the observed behavior, verify the capabilities and limitations of the simulation platform used, and confirm whether any configuration, update, or modification exists that would allow the cold-atmosphere effects during instrument approaches to be correctly reproduced.\n\nOnce the technical response has been received, the need to implement corrections, updates, or compensatory measures will be evaluated, and new subjective tests will be carried out to verify the simulator's behavior in this scenario."}, {"id": "find_msraduqlc506ht", "seq": 18, "title": "SUB.C1 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — a.6 Switches functioning correctly", "category": "Hardware", "cls": "C", "kind": "Subjective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The Autopilot disconnect button on the control yoke does not work. To disconnect the AP, the AP-MASTER must be switched off, or the controls must be moved to override the AP's force.", "resolution": "An inspection of the system will be carried out to determine the exact origin of the fault, checking the condition of the button, the wiring, the connectors, and correct signal reception by the control system.\n\nOnce the cause has been identified, the defective components will be repaired or replaced. After the intervention, functional tests will be performed to confirm that the Autopilot disconnect button operates correctly and that disconnection occurs as expected."}, {"id": "find_msraeslov75pg8", "seq": 19, "title": "SUB.C2 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — a.6 Instruments functioning correctly", "category": "Hardware", "cls": "C", "kind": "Subjective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "When the simulator is switched on, the EFIS STANDBY instrument appears off-center and is not displayed correctly. It is necessary to remove the simulator's forward cowling to access the instrument's electronic control board and reset it manually so that it displays correctly, then reinstall the cowling.\n\nThis defect was identified during the FSTD Organization's own most recent functional and subjective test, carried out on 24-04-2026, but was not recorded in the HIL at the time of the AESA inspection.", "resolution": "The incident will be formally reported to the simulator manufacturer so that it can carry out a technical analysis of the EFIS STANDBY instrument, its electronic control board, and the associated initialization procedures.\n\nThe manufacturer must identify the cause of the fault and propose a permanent solution that eliminates the need for manual resets via physical access to the hardware.\n\nOnce the correction has been implemented, repeated startup tests will be carried out to verify that the instrument initializes correctly every time and maintains a proper display without the need for manual intervention.\n\nThe fault will be reported in the HIL."}, {"id": "find_msrafeh17svj7v", "seq": 20, "title": "OBJ.B1 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — e.3 Updated navigation database", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The last three updates of the Navigation Database have not been performed at the maximum three-month interval established by the regulation, as observed in the NAVDATA UPDATES — Changes Record log:\n\n- Cycle 2506 updated on 14/06/2025\n- Cycle 2510 updated on 15/10/2025, after 4 months had elapsed\n- Cycle 2602 updated on 12/02/2026, after 4 months had elapsed\n- Current cycle installed on 20/05/2026, after slightly more than 3 months had elapsed\n\nHowever, despite the above evidence, internal audit PVC-13, carried out on 10/04/2026, in question 3 of the FSTD-3 area of that audit, indicates that point \"2. Navigation databases are reviewed. Validity should not exceed 3 months\" is compliant.", "resolution": "The manufacturer will be formally notified of the need to ensure that Navigation Database updates are carried out within the deadlines established by the regulation, defining a communication and planning procedure that provides advance notice of scheduled update dates.\n\nAdditionally, the FSTD Organization will implement a specific internal control system to monitor the currency of NAVDATA. This control will include periodic review of the installation date and current AIRAC cycle, as well as the generation of preventive alerts as the maximum permitted limit approaches.\n\nLikewise, the internal audit program and the associated checklists will be reviewed to strengthen documentary verification of navigation database currency, preventing similar situations from going undetected during future audits."}, {"id": "find_msrafynoszqzd5", "seq": 21, "title": "OBJ.B2 — AMC1.FSTD(A).300 Qualification Basis — point (a)(ii)(I)(j): Validation Test Results", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "In the following recurrent QTGs, performed by the operator in the cycle, the irregularities indicated below are observed. However, all of them appear as correct and accepted in log FOR-FTD-001-CNA1-SEP, both by the person who performed them and by the person who verified them:\n\n- Test 2c(1)1 Power Change Dynamics: the MQTG curve on the PRES ALT chart (which starts at 2510 ft) is not the same as the one shown on the approved MQTG (which starts at 2450 ft).\n- Test 2c(5)1 Longitudinal Trim Cruise and 2c(5)2 Longitudinal Trim Approach: it is not clear which column shows the MQTG values and which shows the recurrent test results.\n- In all three Test 2c(8b)x Approach-to-Stall tests, the force values at the moment of Stall Warning are missing.\n- Test 2d(8) Steady State Sideslip Approach: the values transcribed in the MQTG column are incorrect.", "resolution": "The affected QTGs will be repeated using the approved version of the MQTG and carefully verifying all data generated and transcribed in the corresponding records.\n\nThe new results will be independently reviewed to confirm whether the discrepancies detected correspond solely to documentary errors or whether there is any real deviation in the results obtained by the simulator.\n\nIn parallel, the manufacturer will be notified of the situation so that it can analyze the possible existence of errors in report generation, test templates, or software modifications that may have affected the presentation or integrity of the validation data.\n\nLikewise, the internal QTG execution and verification procedure will be reviewed in order to strengthen documentary quality controls prior to formal acceptance of results."}, {"id": "find_msragn5ntk2u49", "seq": 22, "title": "OBJ.B3 — AMC1.FSTD(A).300 Qualification Basis — point (a)(ii)(I)(j): Validation Test Results", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "In the following QTGs, repeated on 28-05-2026 during AESA's recurrent evaluation, the following irregularities are observed:\n\n- Test 2c(2)2 Flap Change Dynamics during Approach: the \"Calibrated Airspeed\" and \"Pitch Angle\" parameters are out of tolerance at the start of the test, and the Bank Angle chart behaves incorrectly (\"CT&M\") relative to the approved MQTG result.\n- Test 2c(7) Longitudinal Static Stability during Approach: the snapshots at 76 kt and 69 kt show an excessive Bank Angle value, -8.09º and -11.69º respectively, when it should be approximately 0º.\n- Test 2c(8b)1 Approach to Stall — Climb Configuration: the \"Calibrated Airspeed\" and \"Pitch Angle\" parameters are out of tolerance during several intervals of the test, and the pitch control force value at the moment of Stall Warning does not appear.\n- Test 2d(3) Step Input Cockpit Roll Controller Approach: the \"Calibrated Airspeed\" chart shows a fairly different speed evolution compared to the MQTG data.\n- Test 2d(4)2 Spiral Stability — Cruise Left: the \"Calibrated Airspeed\" chart shows a fairly different speed evolution compared to the MQTG data, and the \"Bank Angle\" parameter goes out of tolerance from second 30 onward, behaving incorrectly (\"CT&M\") relative to the approved MQTG result.\n- Test 2d(8) Steady State Sideslip — Approach: the column with the MQTG results does not appear. In the recurrent test performed by the FSTD Organization in the cycle, the column with the MQTG values does appear.", "resolution": "The manufacturer will be formally notified of the full set of discrepancies detected during the recurrent evaluation. A thorough review will be requested of the simulator configuration, the changes implemented during the most recent maintenance work, and the parameters associated with the affected QTG tests, with the aim of identifying possible side effects arising from previous modifications.\n\nThe affected QTGs will subsequently be repeated to verify that the detected discrepancies have been eliminated and to confirm that the results obtained are consistent with the approved MQTG reference values.\n\nAdditionally, the FSTD Organization will review its configuration-control and external-modification-tracking process to strengthen oversight of manufacturer changes and minimize the risk of recurrence of similar incidents."}, {"id": "find_msrahgikks1els", "seq": 23, "title": "OBJ.B4 — AMC1.FSTD(A).300 Qualification Basis — point (a)(ii)(I)(j): Validation Test Results / AMC1.FSTD(A).300 point (a)(6) MQTG Content", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "During the automatic repetition of QTG 2c(8b)1 Approach to Stall — Climb Configuration, performed during AESA's recurrent evaluation on 28-05-2026, the indicated airspeed information displayed on the PFD during the Approach-to-Stall phase is recorded on video.\n\nIt is observed that, both in the QTG repeated on 28-05-2026 and in the MQTG, the Calibrated Airspeed value at the moment the Stall Warning activates is approximately 60 kt. However, in the video it is observed that the indicated airspeed value on the PFD is 47 kt at the moment the Stall Warning sounds, which is also the moment the aircraft stalls.", "resolution": "The discrepancy will be forwarded to the manufacturer, along with the QTG results, the applicable MQTG documentation, and the video recording made during the evaluation.\n\nA technical analysis will be requested to verify the consistency between the speeds displayed on the flight instruments, the parameters recorded by the QTGs, and the values used by the flight model during stall-approach maneuvers.\n\nThe manufacturer must identify the origin of the discrepancy and determine whether there is a configuration, parameterization, or integration problem between the display systems and the data-acquisition systems used for validation tests.\n\nOnce the necessary corrective actions have been implemented, the affected QTG will be repeated and a new verification will be carried out by video recording to confirm consistency between the values shown in the cockpit and the results recorded in the validation tests."}, {"id": "find_msrgitgatlzrb1", "seq": 24, "source": "authority", "title": "SUB.B1 Apéndice 1 CS FSTD(A).300 Estándares FSTD-3.Sistema Visual-d.1: Visual sin discontinuidades", "category": "Visual System", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": "2026-09-10", "status": "Open", "description": "Se debe mejorar el solape/”Blending” entre el proyector hacia el lado izquierdo y hacia el frontal, pues en la zona de solape se ve doble imagen.", "resolution": "Se procederá al reajuste de la posición del proyector izquierdo para optimizar su alineación con el proyector frontal.", "closureEvidence": "Se aportarán fotos del sistema visual tras el reajuste del proyector.\n\nSE ACEPTA, PERO SE REQUIEREN ACCIONES CORRECTORAS/PREVENTIVAS ADICIONALES.\nPENDIENTE DE EVIDENCIA PARA CIERRE\n\nSe considera que no se necesitan tres meses desde la fecha de la inspección para solucionar este problema. Se considera suficiente disponer de un mes desde la emisión del Acta de Inspección para el ajuste del blending.\n\nAdicionalmente, como acción preventiva para evitar que vuelva a ocurrir, se deberá evidenciar que el chequeo del Blending correcto entre proyectores está incluido como punto de chequeo en cada una de las varias pruebas subjetivas que realiza la Organización FSTD en cada ciclo de evaluación, o bien en la Checklist de mantenimiento trimestral."}, {"id": "find_msrglha1zjlrtz", "seq": 25, "source": "authority", "title": "SUB.B2 Apéndice 1 CS FSTD(A).300 Estándares FSTD-1.General-g.1: Funcionamiento de Sistemas.", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": "2026-10-17", "status": "Awaiting Authority", "description": "Cuando se activa el fallo de fuego en APU, el fuego no se extingue:\n-\tNi con el avión en tierra, después de que se haya producido el Autoshutdown y activación automática de la descarga del agente extintor del APU, y habiendo completado la acción ECAM de saltar el “maneral” de fuego de APU en el Overhead Panel.\n-\tNi con el avión en vuelo, después de completar todos los pasos del ECAM, saltando el “maneral” de fuego de APU en el Overhead Panel, activando la descarga del agente extintor del APU, y poniendo el Master Switch del APU en OFF.", "resolution": "Si resultara ser un fallo en la lógica del sistema realizado por el fabricante, y se implementara una actualización de software, posteriormente a esa se realizarán pruebas funcionales para verificar el correcto funcionamiento tanto en operaciones en tierra como en vuelo.", "closureEvidence": "10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE\nSi el fabricante confirma que es fallo de la lógica del sistema y no lo soluciona antes de la fecha debida, se deberá incluir este fallo en el listado de diferidos del simulador, pendiente de la instalación de la modificación software que lo solucione. La discrepancia se podrá cerrar, en ese caso, presentando el HIL-Listado de diferidos como evidencia, con la anotación del fallo.\n\nSi el fabricante confirma que es así como lo ha simulado, que el fuego de APU no se apaga, entonces se deberá solicitar al fabricante que describa correctamente este fallo en el documento IOS Operating Manual del EN4000X y aportarlo como evidencia para el cierre, o evidenciar que se tiene otro medio alternativo para informar a los usuarios del FSTD.\n\n\nRespuesta Organización FSTD 10-08-2026:\nRespuesta Fabricante en el Bug Tracking \n05/08/26 - CORRECTED\n“El fallo de APU fire no está simulado como autoextinguible. Se simula fuego en la APU mientras esté el fallo activado. Queda a criterio del instructor desactivarlo para simular su extinción, de manera que pueda hacerlo en el momento que considere o no hacerlo en absoluto, en función de lo que se quiera simular.\"\n\nSe pide al fabricante en fecha 10/08/2026 la actualización del fallo en la IOS Operating Manual. Pendiente de nueva Revision del Manual."}, {"id": "find_msrgncl4lxutf1", "seq": 26, "source": "authority", "title": "SUB.B3 Apéndice 1 CS FSTD(A).300 Estándares FSTD-1.General-e.2:Funcionamiento de equipo de navegación.", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": "2026-10-17", "status": "Open", "description": "No se oye por los altavoces o auriculares el código morse identificador de radioayudas de navegación.", "resolution": "Se revisará la configuración del sistema de navegación y del sistema de audio del simulador para restablecer la reproducción del código Morse identificador de las radioayudas (VOR/NDB), verificando su correcta audición tanto por los altavoces como por los auriculares. Posteriormente se realizarán pruebas funcionales para confirmar el correcto funcionamiento en todos los puestos de la cabina.", "closureEvidence": "Se aportará evidencia video del correcto funcionamiento del sistema."}, {"id": "find_msrgovo9nw0lns", "seq": 27, "source": "authority", "title": "SUB.C1 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.a.6 – Equipamiento de la cabina de vuelo.", "category": "Hardware", "cls": "C", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": "2026-10-17", "status": "Awaiting Authority", "description": "No funciona el mando del ajuste lateral para la altura ni el ajuste frontal para la inclinación, del reposabrazos izquierdo del asiento del CM1/CAPTAIN /COMANDANTE.\nNo funciona el mando del ajuste frontal para la inclinación del reposabrazos derecho del asiento del CM2/FO /COPILOTO.\nPara un avión que reproduce el mando de control SideStick del A320 es importante tener un correcto ajuste del reposabrazos donde se apoya el brazo que controla el Sidestick", "resolution": "Se procederá a la reparación de los mecanismos de ajuste afectados en los reposabrazos de ambos asientos, verificando posteriormente el correcto funcionamiento de todos los movimientos de regulación. Se comprobará que los reposabrazos permiten adoptar una posición ergonómica adecuada para la operación del SideStick, conforme a la configuración del avión de referencia.", "closureEvidence": "10-08-2026\nSE ACEPTA, PERO SE REQUIEREN ACCIONES CORRECTORAS/PREVENTIVAS ADICIONALES.\nPENDIENTE DE EVIDENCIA PARA CIERRE\n\nComo acción preventiva para evitar que vuelva a ocurrir se deberá evidenciar que el chequeo del funcionamiento correcto de los ajustes de los reposabrazos de los pilotos está incluido como punto de chequeo en cada una de las varias pruebas subjetivas que realiza la Organización FSTD en cada ciclo de evaluación, o bien en la Checklist de mantenimiento trimestral.\n\nRespuesta Organización FSTD 12-08-2026:\nSe comprueban los reposabrazos. Tornillos prisioneros estaban atascados, se procede a sus arregle. Sistema reposabrazos funcionantes. Se aportan videos de los reposabrazos y formato prueba subjetiva con el cambio requerido por AESA."}, {"id": "find_msrgq6p4hns235", "seq": 28, "source": "authority", "title": "SUB.C2 Apéndice 1 CS FSTD(A).300 Estándares FSTD-1.General-g.1: Funcionamiento de Sistemas.", "category": "Hardware", "cls": "C", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": "2026-10-17", "status": "Closed", "description": "La MCDU 1 está inoperativa y desmontada de su posición, porque se ha enviado al fabricante para que la repare, lo cual debería ocurrir en un plazo corto de tiempo.\nAunque este defecto, ocurrido el 07-07-2026, se encuentra correctamente anotado en el HIL-Registro de Diferidos del simulador, se incluye como discrepancia únicamente a efectos de controlar en qué momento se concluye la reparación y está de nuevo operativa, ya que es un elemento importante del simulador.", "resolution": "La MCDU se encontraba en Madrid para la reparación desde el 16/07/2026. Se recibe en Canavia en fecha 27/07/2026 y se monta sobre la marcha 10 minutos después. Operativa al 100%.", "closureEvidence": "Se aporta video del correcto funcionamiento de la MCDU1 instalada y cierre de HIL y PTV.\n\n10-08-2026\nSE ACEPTA Y SE CIERRA"}, {"id": "find_msrgrlhj2tvkzv", "seq": 29, "source": "authority", "title": "SUB.E1 ORA-FSTD.120 Equipamiento adicional. AMC1 FSTD(A).300 Bases de Calificación-(c) Prueba funcional y Subjetiva-m.Sistema Visual-(1)(f)", "category": "Visual System", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": null, "status": "Open", "description": "Al colocar el avión en la posición GATE Nº8 del aeropuerto GCXO-Tenerife Norte, que es uno de los aeropuertos definidos como específicos por la Organización FSTD, se observa en el Visual que esa posición está ya ocupada por un avión ATR72.\nAunque no se llega a provocar un “Crash” al superponerse ambos aviones ni al realizar un “pushback”, se recomienda que se elimine esa aeronave de ese Gate, o que se defina otro Gate en una posición vacía en el aeropuerto GCXO-Tenerife Norte.\n\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "Se cambiará la posición de GCXO con otro gate sin tráfico de X-Plane.", "closureEvidence": "10-08-2026\nSE ACEPTA \nPENDIENTE DE EVIDENCIA PARA CIERRE"}, {"id": "find_msrgspk0u0w0q5", "seq": 30, "source": "authority", "title": "SUB.E2 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.g.1 – Funcionamiento de Sistemas.", "category": "Software", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": null, "status": "Closed", "description": "Cuando se vuela una aproximación RNP AR APPROACH, las indicaciones de desvío lateral L/DEV y vertical V/DEV que se muestran en el PFD, en las posiciones típicas de las escalas de desvío del ILS, tienen un color magenta. Sin embargo, en el AIRBUS A320 real son de color verde.\nSe recomienda solicitar al fabricante del simulador que corrija el código de colores asociado a las indicaciones de desvío lateral y vertical en aproximaciones RNP AR APPROACH, para que sea igual que en el A320 real.\n\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD acepta la recomendación y ha trasladado en fecha 21/07/2026 la incidencia al fabricante del simulador para solicitar la modificación del código de colores de las indicaciones L/DEV y V/DEV, de forma que se correspondan con la representación del Airbus A320 real. La implantación de esta mejora estará sujeta a su disponibilidad en una futura actualización del software del fabricante.", "closureEvidence": "10-08-2026\nSE ACEPTA Y SE CIERRA\n\nSi es posible, sería deseable tener evidencia de la respuesta del fabricante del simulador, sobre si corregirá, en una versión futura del software, el color de las indicaciones L/DEV y V/DEV durante aproximaciones RNP AR APPROACH\n\n\nRespuesta Fabricante en el Bug Tracking:\n05/08/26 - TO UPDATE\n“Se modificará el color a verde. Se instalará en la próxima versión del Simulador v2.16. Prevista Octubre 2026.”"}, {"id": "find_msrgtnsf6lmmx4", "seq": 31, "source": "authority", "title": "SUB.E3 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.g.1 – Funcionamiento de Sistemas.", "category": "Software", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": null, "status": "Closed", "description": "Cuando se selecciona el fallo de ENGINE HUNG START, aparece un primer aviso ECAM de ENG START FAULT en color ámbar (lo que es correcto), pero aparece a continuación un segundo aviso ECAM de STARTER TIME EXCEEDED en color azul, lo que no es correcto pues, según el FCOM del AIRBUS A320, debería ser también en color ámbar.\nSe recomienda solicitar al fabricante del simulador que corrija el código de colores asociado a este segundo aviso ECAM para que sea igual que en el A320 real.\n\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD acepta la recomendación y ha trasladado en fecha 21/07/2026 la incidencia al fabricante del simulador para solicitar la modificación del código de colores de las indicaciones STARTER TIME EXCEEDED, de forma que se correspondan con la representación del Airbus A320 real. La implantación de esta mejora estará sujeta a su disponibilidad en una futura actualización del software del fabricante.", "closureEvidence": "10-08-2026\nSE ACEPTA Y SE CIERRA\n\nSi es posible, sería deseable tener evidencia de la respuesta del fabricante del simulador, sobre si corregirá, en una versión futura del software, el color de la indicación ECAM de STARTER TIME EXCEEDED.\n\n\nRespuesta Fabricante en el Bug Tracking:\n05/08/26 - TO UPDATE\n“Se modificará el color a ámbar. Se instalará en la próxima versión del Simulador v2.16. Prevista Octubre 2026.”"}, {"id": "find_msrguk47629p6u", "seq": 32, "source": "authority", "title": "SUB.E4 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.d.2 – Iluminación de paneles e instrumentos", "category": "Hardware", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": null, "status": "Open", "description": "Algunos de los botones del panel FCU están muy desgastados y apenas se distingue su leyenda, especialmente los dos botones de “FD-Flight Director” y “LS-Landing System” de cada piloto y el botón de “APCH”. También algún botón de la MCDU 2. No se pudo valorar la MCDU 1 porque está en reparación.\nSe recomienda sustituir lo antes posible los botones deteriorados por otros con una leyenda visible.\n\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD acepta la recomendación y procederá a la sustitución de los pulsadores deteriorados del FCU (FD, LS y APCH) y de aquellos de la MCDU que presenten un desgaste significativo, restableciendo la correcta legibilidad de las leyendas y garantizando unas condiciones adecuadas para la instrucción. La sustitución se realizará en cuanto se disponga de los repuestos correspondientes.", "closureEvidence": "10-08-2026\nSE ACEPTA \nPENDIENTE DE EVIDENCIA PARA CIERRE"}, {"id": "find_msrgwdi7uggi3w", "seq": 33, "source": "authority", "title": "SUB.E5 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.c.1 – Efecto del peso en la dinámica de vuelo", "category": "Software", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": null, "status": "Awaiting Authority", "description": "Según el diagrama de peso y centrado de la página de “WEIGHT&SYS” de la IOS y según los límites máximos permisibles para el “Zero Fuel Weight” y para el “Fuel Weight”, es posible seleccionar un peso al despegue de 77.000 kg o más.\nSin embargo, al despegar desde GCFV-Fuerteventura con un peso de 77.000 kg, al avión le costó mucho rotar y elevarse inicialmente con fallo de motor. \nSe recomienda consultar con el fabricante del simulador si el modelo de motor que tiene implementado permite realmente despegar con tanto peso, o si convendría limitar en la IOS el peso máximo al despegue a un valor de 73.500 kg, que suele ser más típico del A320.\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD acepta la recomendación y ha trasladado en día 21/07/2026 la consulta al fabricante del simulador para verificar que el modelo de rendimiento y de motores implementado es coherente con los límites de peso configurados en la IOS. En función de la respuesta del fabricante, se valorará la limitación del peso máximo seleccionable en la IOS o la aplicación de la actualización de software que corresponda.", "closureEvidence": "10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE\n\nA la espera de la evidencia de la respuesta del fabricante del simulador, sobre si el peso máximo al despegue puede ser de 77.000 kg o superior, o debería estar limitado a un valor inferior.\n\n\nRespuesta Organización FSTD 10-08-2026:\nRespuesta Fabricante en el Bug Tracking\n05/08/26 - CORRECTED\n“Consideramos que el comportamiento es adecuado. Probando un despegue en dicha pista (ISA STD, QNH1013):\n- El simulador es capaz de despegar a peso máximo, teniendo en cuenta un VR adecuada, que será más elevada de lo normal.\n- El simulador, con un fallo de motor, asciende inicialmente con una VS en torno a los 700ft/min.\nEn cualquier caso, si el operador lo considera, se puede limitar el entrenamiento a unos valores de peso que no estén al límite de la envolvente.\""}, {"id": "find_msrh3damex5kja", "seq": 34, "source": "authority", "title": "SUB.E6 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.a.6 – Interruptores del cockpit representativos", "category": "Hardware", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": null, "status": "Closed", "description": "La presencia en configuración JET de funciones y botones correspondientes a MEP en el panel frontal del dispositivo puede inducir a errores de utilización y afectar a la representatividad del entrenamiento. \nSe recomienda su tapado, como sí se ha hecho en la zona del pedestal y FCU.\n\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD no acepta esta recomendación, al considerar que los elementos indicados no afectan al funcionamiento del simulador ni a la representatividad del entrenamiento impartido. Asimismo, esta configuración ha sido aceptada en anteriores evaluaciones sin que se hayan formulado observaciones al respecto. No obstante, la Organización revisará esta cuestión en futuras actualizaciones o modificaciones del dispositivo, si el fabricante ofrece una solución específica.", "closureEvidence": "No aplica. Se mantendrá la configuración actual del FSTD.\n\n10-08-2026\nSE ACEPTA Y SE CIERRA"}, {"id": "find_msrh50udnbap2h", "seq": 35, "source": "authority", "title": "OBJ.B1 ORA.FSTD.115 (a) Instalaciones", "category": "Other", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": "2026-09-10", "status": "Open", "description": "Junto al simulador hay almacenados botes de pintura y otros utensilios, cuyo sitio no debe ser ese.", "resolution": "Se procederá a la retirada inmediata de los botes de pintura y demás utensilios, trasladándolos a la zona de almacenamiento destinada al material de mantenimiento, garantizando que el entorno del FSTD permanezca libre de objetos ajenos a la operación del simulador.", "closureEvidence": "Se aportará foto.\n\n10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE"}, {"id": "find_msrh6nb9obrjx9", "seq": 36, "source": "authority", "title": "OBJ.E1 ORA.FSTD.105 (b) Control de ejecución de QTGs", "category": "Documentation", "cls": "E", "kind": "Objective", "deviceId": "dev_msr9p8ox9zcgst", "authority": "AESA", "dateRaised": "2026-07-16", "dueDate": null, "status": "Awaiting Authority", "description": "El Test 2.d.(6).2 Rudder Response – Direct Law se ha ejecutado el 01-06-2026, que corresponde al CUARTO TRIMESTRE-Q4. Sin embargo, en el formato FOR-FTD-001-CNA2-JET de control de ejecución de QTGs no se incluye ni en ese trimestre ni en ningún otro.\nSe recomienda incluir dicho test en el registro FOR-FTD-001-CNA2-JET de control de ejecución de QTGs, en el trimestre que corresponda.\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD acepta la recomendación y procederá a actualizar el registro FOR-FTD-001-CNA2-JET, incorporando el Test 2.d.(6).2 Rudder Response – Direct Law en el trimestre correspondiente.", "closureEvidence": "10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE\n\nRespuesta Organización FSTD 10-08-2026:\nSe aporta el FOR-FTD-001-CNA2-JET actualizado."}, {"id": "find_msrh7rwtrkioe8", "seq": 37, "source": "authority", "title": "SUB.B1 Apéndice 1 CS FSTD(A).300 Estándares FSTD-3.Sistema Visual-d.1: Visual sin discontinuidades", "category": "Visual System", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": "2026-09-10", "status": "Open", "description": "Se debe mejorar el solape/”Blending” entre el proyector hacia el lado izquierdo y hacia el frontal, pues en la zona de solape se ve doble imagen.", "resolution": "Se procederá al reajuste de la posición del proyector izquierdo para optimizar su alineación con el proyector frontal.", "closureEvidence": "10-08-2026\nSE ACEPTA, PERO SE REQUIEREN ACCIONES CORRECTORAS/PREVENTIVAS ADICIONALES.\nPENDIENTE DE EVIDENCIA PARA CIERRE\n\nSe considera que no se necesitan tres meses desde la fecha de la inspección para solucionar este problema. Se considera suficiente disponer de un mes desde la emisión del Acta de Inspección para el ajuste del blending.\n\nAdicionalmente, como acción preventiva para evitar que vuelva a ocurrir, se deberá evidenciar que el chequeo del Blending correcto entre proyectores está incluido como punto de chequeo en cada una de las varias pruebas subjetivas que realiza la Organización FSTD en cada ciclo de evaluación, o bien en la Checklist de mantenimiento trimestral."}, {"id": "find_msrh99vg4hl3k6", "seq": 38, "source": "authority", "title": "SUB.B2 Apéndice 1 CS FSTD(A).300 Estándares FSTD-1.General-g.1: Funcionamiento de Sistemas.", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": "2026-10-17", "status": "Awaiting Authority", "description": "Con el avión en tierra, al intentar parar el motor derecho retrasando por completo la palanca de mezcla de combustible a posición de corte, el motor no se para incluso aunque haya pasado bastante tiempo. \nEl motor solo se para al avanzar la palanca de potencia al tope máximo y retrasarla de nuevo.\nEn el motor izquierdo sí funciona bien el procedimiento normal de parada del motor, al retrasar totalmente el mando de mezcla de combustible sin necesidad de mover otra palanca.", "resolution": "Se revisará la configuración y programación del sistema de control del motor derecho, verificando la correcta asociación entre el mando de mezcla y la lógica de parada del motor. Tras la corrección, se realizarán pruebas funcionales para confirmar que el motor se detiene correctamente al llevar la palanca de mezcla a la posición de corte, sin necesidad de accionar la palanca de potencia.", "closureEvidence": "10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE\n\nRespuesta Organización FSTD 10-08-2026:\nSe ha intentado reproducir el fallo, sin embargo, el sistema funciona correctamente. Se han hecho tres intentos, uno de ellos en IDLE, y otro en FULL POWER, y al quitar la mezcla el motor se para correctamente. Se adjuntan los tres videos:\n-\tSUB.B2 MEP Shutdown R Engine Attempt 1\n-\tSUB.B2 MEP Shutdown R Engine Attempt 2\n-\tSUB.B2 MEP Shutdown R Engine Attempt 3"}, {"id": "find_msrhaedwcipuio", "seq": 39, "source": "authority", "title": "SUB.B3 Apéndice 1 CS FSTD(A).300 Estándares FSTD-1.General-g.1: Funcionamiento de Sistemas.", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": "2026-10-17", "status": "Awaiting Authority", "description": "Durante un aterrizaje ILS en GCLP-Gran Canaria en la pista 03L con el TAWS activado, y volando con el Piloto Automático perfectamente centrado tanto en el LOC-Localizador como en la GS-Senda de Descenso, salta el aviso TAWS de proximidad del terreno justo antes de que salte el aviso normal de 500ft.\nEste fallo de que salte el aviso TAWS de proximidad del terreno, durante una aproximación perfectamente estabilizada a un aeropuerto seleccionado en el plan de vuelo, es recurrente en este simulador.", "resolution": "Se ha trasladado al fabricante en día 21/07/2026 y se revisará la configuración y programación del sistema TAWS para verificar los parámetros de activación de los avisos de proximidad al terreno durante aproximaciones de precisión. En caso de confirmarse la incidencia, se solicitará al fabricante la corrección de la lógica del sistema para adecuarla al comportamiento de la aeronave de referencia. Posteriormente se realizarán pruebas funcionales en aproximaciones ILS para verificar la correcta operación del TAWS.", "closureEvidence": "10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE\n\nRespuesta Organización FSTD 10-08-2026:\nRespuesta Fabricante en Bug Tracking \n06/08/26 - TO UPDATE\n“Se mejorará la detección del TAWS para evitar alertas estando correctamente establecido en una aproximación. Se instalará en la próxima versión del Simulador MEP v2.14. Prevista Octubre 2026.”"}, {"id": "find_msrhbowsgi0em4", "seq": 40, "source": "authority", "title": "SUB.B4 Apéndice 1 CS FSTD(A).300 Estándares FSTD-1.General-g.1: Funcionamiento de Sistemas.", "category": "Hardware", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": "2026-10-17", "status": "Closed", "description": "No funciona bien el mando del Rudder Trim, tiene una sensibilidad muy poco lineal y presenta una holgura excesiva, por lo que es bastante difícil compensar correctamente el avión cuando es necesario.", "resolution": "Se ha procedido a la revisión mecánica y recalibración del mando de Rudder Trim.\n\n10-08-2026\nSE ACEPTA Y SE CIERRA", "closureEvidence": ""}, {"id": "find_msrhcqz0r4iuru", "seq": 41, "source": "authority", "title": "SUB.C1 Apéndice 1 CS FSTD(A).300 Estándares FSTD-1.General-g.1: Funcionamiento de Sistemas.", "category": "Hardware", "cls": "C", "kind": "Subjective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": "2026-10-17", "status": "Closed", "description": "No funciona la palanca selectora de Flaps. La posición de los flaps es siempre la de Despegue – Take off, independientemente de la posición de la palanca de flaps.\nAunque este defecto, ocurrido el 21-05-2026, se encuentra correctamente anotado en el HIL-Registro de Diferidos del simulador, se incluye como discrepancia a efectos de controlar en qué momento se concluye la reparación y el FLAP esté de nuevo operativo, ya que es un elemento importante del simulador. \nEsta limitación afecta a la representatividad del simulador, pudiendo influir en los resultados obtenidos en pruebas relacionadas con prestaciones de despegue, mantenimiento de velocidad y altitud, sensibilidad a variaciones de potencia, fallo Trim Runaway y fallos de motor tanto en despegue como en crucero.\nAdemás, no es aceptable que un fallo tan importante como éste se tarde casi dos meses en arreglarlo.", "resolution": "Se ha procedido a la reparación del sistema de selección de flaps.", "closureEvidence": "Video que evidencia el correcto funcionamiento y PTV + HIL cerrados. \n\n10-08-2026\nSE ACEPTA Y SE CIERRA"}, {"id": "find_msrhdslgmy2zcr", "seq": 42, "source": "authority", "title": "SUB.E1 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.g.1 – Funcionamiento de Sistemas.", "category": "Software", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": null, "status": "Closed", "description": "Cuando se fallan ambos generadores de corriente eléctrica, la batería tarda entre 30-40 min en descargarse completamente y dejar al avión sin potencia eléctrica, lo que es correcto.\nSin embargo, la única indicación de descarga de la batería que se tiene es la de los amperios. El voltaje de la batería permanece siempre constante alrededor de los 14 volt dentro de la zona amarilla, durante los 30-40 min de duración de la batería, hasta que de repente se apagan todos los instrumentos.\nSe recomienda solicitar al fabricante del simulador que mejore el efecto de la simulación de descarga de la batería, simulando que el voltaje de la batería vaya disminuyendo poco a poco con el paso del tiempo y que la batería se quede sin potencia al llegar la indicación de voltaje a la zona roja del indicador, como si ocurre en otros modelos del simulador ENTROL EN1000 MEP.\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD acepta la recomendación y ha trasladado en día 21/07/2026 la incidencia al fabricante del simulador para solicitar la mejora del modelo de simulación de la batería, de forma que la indicación de voltaje disminuya progresivamente durante la descarga hasta alcanzar la zona roja antes de la pérdida total de alimentación eléctrica. La implantación de esta mejora dependerá de su inclusión en una futura actualización del software del fabricante.", "closureEvidence": "10-08-2026\nSE ACEPTA Y SE CIERRA\n\nSi es posible, sería deseable tener evidencia de la respuesta del fabricante del simulador, sobre si corregirá, en una versión futura del software, que la indicación de voltaje de la batería vaya disminuyendo hasta la zona roja, a medida que se vaya descargando.\n\nRespuesta Fabricante en el Bug Tracking \n05/08/26 - CORRECTED\n“Con un doble fallo de alternador, se simula una reducción en el voltaje de la batería, que caerá de 14V a 12V. No se simula una reducción gradual.\nEl comportamiento se considera adecuado para un nivel FNPT II y para entrenamiento procedimientos asociados a fallos eléctricos.\""}, {"id": "find_msrhfw1foavrh0", "seq": 43, "source": "authority", "title": "SUB.E2 Apéndice 1 de CS-FSTD(A).300 Estándares FSTD – 1.General.g.1 – Funcionamiento de Sistemas.", "category": "Software", "cls": "E", "kind": "Subjective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": null, "status": "Awaiting Authority", "description": "Para que funcione correctamente el poder volar una aproximación PBN del tipo LPV en la zona de las Islas Canarias, es necesario tener seleccionadas en el GARMIN como activas las tres constelaciones de satélites SBAS de “corrección” de señal: EGNOS, WAAS y MSAS. \nSi en el GARMIN sólo se selecciona como activa la constelación EGNOS, entonces las aproximaciones LPV aparecen como “unavailable” en el listado disponible de aproximaciones.\nSe recomienda consultar con el fabricante del simulador si este funcionamiento del GARMIN es el correcto.\nNOTA: es una recomendación de mejora pero se espera que la Organización FSTD indique si la va a tener en cuenta o, en caso contrario, que justifique por qué no la va a considerar.", "resolution": "La Organización FSTD acepta la recomendación y ha trasladado en día 21/07/2026 la consulta al fabricante del simulador para verificar si el comportamiento observado es conforme al funcionamiento previsto del equipo Garmin y de las aproximaciones LPV en la región de Canarias. En caso de confirmarse una discrepancia, se solicitará la correspondiente corrección mediante una futura actualización del software.", "closureEvidence": "10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE\nSi es posible, sería deseable tener evidencia de la respuesta del fabricante del simulador, sobre si es correcto el comportamiento del GARMIN en lo referente a qué constelaciones SBAS deben estar activadas para poder volar una aproximación LPV en la región de Canarias.\n\nSuponiendo que se confirme que sea un fallo de cómo está simulado el comportamiento del receptor GNSS/GARMIN por parte del fabricante, y que éste procederá a su corrección en una versión software futura, en ese caso se debería evidenciar que el fallo está anotado en el HIL-Listado de Diferidos mientras dure.\n\nRespuesta Organización FSTD 10-08-2026:\nSe ha intentado reproducir el fallo, sin embargo, el sistema funciona correctamente. Al quitar todas las constelaciones de SBAS, los procedimientos LPV aparecen como UNAVAIL, y al seleccionar solo EGNOS, vuelven a estar disponibles. Se adjunta video “SUB.E2 MEP LPV Approach Database with EGNOS”"}, {"id": "find_msrhgxob7d4wzu", "seq": 44, "source": "authority", "title": "OBJ.B1 ORA.FSTD.115 (a) Instalaciones", "category": "Other", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9pj9su994ni", "authority": "AESA", "dateRaised": "2026-07-17", "dueDate": "2026-09-10", "status": "Open", "description": "Junto al simulador hay almacenados botes de pintura y otros utensilios, cuyo sitio no debe ser ese.", "resolution": "Se procederá a la retirada inmediata de los botes de pintura y demás utensilios, trasladándolos a la zona de almacenamiento destinada al material de mantenimiento, garantizando que el entorno del FSTD permanezca libre de objetos ajenos a la operación del simulador.", "closureEvidence": "10-08-2026\nSE ACEPTA\nPENDIENTE DE EVIDENCIA PARA CIERRE"}], "documents": [], "holdItems": [{"id": "hil_msrg6fp972c12b", "seq": 1, "deviceId": "dev_msr9o7w9uqym5s", "atlLogItem": "K-1699", "affectedVersion": "BOTH", "description": "Pitch Trim goes fully DOWN for zero force during flight.", "initialsReport": "Eligio Vescovo", "reportDate": "2026-05-21", "defectCategory": "MIN", "dueDate": "2026-08-18", "closureAtlLogItem": "", "closureHours": "", "closureDate": null, "initialsClosure": ""}, {"id": "hil_msrg81mrqp22ax", "seq": 2, "deviceId": "dev_msr9o7w9uqym5s", "atlLogItem": "K-1700", "affectedVersion": "BOTH", "description": "Visual System blending misaligned due to somebody removed the USB Dongle with the ImmersivePRO Licence.", "initialsReport": "Eligio Vescovo", "reportDate": "2026-05-23", "defectCategory": "MAJ", "dueDate": "2026-06-21", "closureAtlLogItem": "", "closureHours": "", "closureDate": null, "initialsClosure": ""}, {"id": "hil_msrg945f2690tu", "seq": 3, "deviceId": "dev_msr9o7w9uqym5s", "atlLogItem": "K-1701", "affectedVersion": "BOTH", "description": "Standby Instruments misaligned.", "initialsReport": "Eligio Vescovo", " async function boot(){
  await openDatabase();
  await loadAll();
  const isEmpty = STATE.devices.length===0 && STATE.findings.length===0 && STATE.documents.length===0;
  if(isEmpty && typeof SEED_DATA !== 'undefined'){
    await importBackupData(SEED_DATA);
    toast('Restored your saved records');
  }
  await ensureStandardFolders();
  await ensureMaintenanceTasks();
  await ensureDefaultRemoteConnections();

  const finishBoot = ()=>{
    document.querySelectorAll('.navlist button[data-view]').forEach(btn=>{
      btn.onclick = ()=> setView(btn.dataset.view);
    });
    document.getElementById('menuToggle').onclick = ()=> document.getElementById('sidebar').classList.toggle('open');
    const quickLockBtn = document.getElementById('quickLockBtn');
    if(STATE.settings.appLockEnabled && STATE.settings.appLockHash){
      quickLockBtn.hidden = false;
      quickLockBtn.onclick = ()=> lockNow();
    }
    setView('dashboard');
  };

  if(STATE.settings.appLockEnabled && STATE.settings.appLockHash && !isUnlockedThisSession()){
    showLockScreen(finishBoot);
  } else {
    finishBoot();
  }
}
boot();
</script>
