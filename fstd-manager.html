<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSTD Ops Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0a1523;
    --navy-900:#0e1c30;
    --navy-800:#16293f;
    --navy-700:#1e3450;
    --slate-500:#5b6b85;
    --slate-300:#a9b4c6;
    --slate-200:#d6dbe4;
    --paper:#f3f5f9;
    --card:#ffffff;
    --amber:#d99a3c;
    --amber-deep:#b97b1f;
    --red:#c9432f;
    --red-soft:#fbe6e2;
    --green:#3f7d5c;
    --green-soft:#e3f1e9;
    --yellow-soft:#fbf0da;
    --border:#e2e6ee;
    --shadow: 0 1px 2px rgba(10,21,35,.06), 0 8px 24px -12px rgba(10,21,35,.12);
    --radius: 10px;
    --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
    --font-body:'Inter', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--navy-900);
    font-family:var(--font-body); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
  .mono{font-family:var(--font-mono);}
  button{font-family:inherit; cursor:pointer;}
  a{color:inherit;}
  ::selection{background:var(--amber); color:var(--navy-950);}

  .app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:236px; flex:none; background:var(--navy-950);
    color:var(--slate-300); display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{
    padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .brand .tag{
    display:inline-block; font-family:var(--font-mono); font-size:10px;
    letter-spacing:.14em; color:var(--amber); border:1px solid rgba(217,154,60,.4);
    padding:2px 6px; border-radius:4px; margin-bottom:8px;
  }
  .brand-logo{ display:block; width:100%; max-width:172px; height:auto; margin-bottom:12px; }
  .brand h1{color:#fff; font-size:18px; line-height:1.25;}
  .brand .sub{font-size:11px; color:var(--slate-500); margin-top:4px;}
  nav.navlist{padding:14px 10px; flex:1; overflow-y:auto;}
  .navlist button{
    width:100%; display:flex; align-items:center; gap:10px;
    background:none; border:none; color:var(--slate-300);
    padding:10px 12px; border-radius:8px; font-size:13.5px; font-weight:500;
    text-align:left; margin-bottom:2px; position:relative;
  }
  .navlist button:hover{background:rgba(255,255,255,.06); color:#fff;}
  .navlist button.active{background:var(--navy-800); color:#fff;}
  .navlist button.active::before{
    content:''; position:absolute; left:-10px; top:8px; bottom:8px; width:3px;
    background:var(--amber); border-radius:2px;
  }
  .navlist .ic{width:16px; text-align:center; opacity:.85; font-size:14px;}
  .navlist .badge{
    margin-left:auto; font-family:var(--font-mono); font-size:10.5px;
    background:var(--red); color:#fff; padding:1px 6px; border-radius:20px;
  }
  .navlist .group-label{
    font-size:10px; letter-spacing:.12em; color:var(--slate-500);
    text-transform:uppercase; padding:14px 12px 6px;
  }
  .sidebar-foot{
    padding:14px 20px; border-top:1px solid rgba(255,255,255,.08);
    font-size:11px; color:var(--slate-500);
  }

  /* Main */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    background:var(--card); border-bottom:1px solid var(--border);
    padding:16px 28px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:5;
  }
  .topbar h2{font-size:20px;}
  .topbar .desc{font-size:12.5px; color:var(--slate-500); margin-top:2px;}
  .topbar-actions{display:flex; gap:10px; align-items:center;}
  .content{padding:24px 28px 60px; flex:1;}

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; gap:6px; border-radius:8px;
    padding:9px 14px; font-size:13px; font-weight:600; border:1px solid transparent;
    transition:filter .12s;
  }
  .btn:hover{filter:brightness(0.96);}
  .btn-primary{background:var(--navy-900); color:#fff;}
  .btn-amber{background:var(--amber); color:var(--navy-950);}
  .btn-outline{background:#fff; border-color:var(--border); color:var(--navy-900);}
  .btn-danger{background:var(--red-soft); color:var(--red);}
  .btn-ghost{background:transparent; color:var(--slate-500); padding:6px 8px;}
  .btn-sm{padding:6px 10px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  /* Cards / grid */
  .grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
  .stat-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .stat-card .n{font-family:var(--font-display); font-size:28px; font-weight:700;}
  .stat-card .l{font-size:12px; color:var(--slate-500); margin-top:2px;}
  .stat-card.warn .n{color:var(--amber-deep);}
  .stat-card.bad .n{color:var(--red);}
  .stat-card.good .n{color:var(--green);}

  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); margin-bottom:20px; overflow:hidden;
  }
  .panel-head{
    padding:14px 18px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-head h3{font-size:14.5px;}
  .panel-body{padding:16px 18px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--slate-500); padding:9px 12px; border-bottom:1px solid var(--border);
    background:#fafbfd;
  }
  td{padding:11px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fafbfd;}

  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .pill-ok{background:var(--green-soft); color:var(--green);}
  .pill-soon{background:var(--yellow-soft); color:var(--amber-deep);}
  .pill-over{background:var(--red-soft); color:var(--red);}
  .pill-neutral{background:#eef1f6; color:var(--slate-500);}
  .pill-dot{width:6px; height:6px; border-radius:50%; background:currentColor;}

  .empty{
    text-align:center; padding:44px 20px; color:var(--slate-500);
  }
  .empty .ic{font-size:26px; margin-bottom:8px;}
  .empty h4{color:var(--navy-900); margin-bottom:4px; font-size:14px;}

  .list-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:11px 0; border-bottom:1px solid var(--border);
  }
  .list-row:last-child{border-bottom:none;}

  .alert-row{
    display:flex; align-items:center; gap:10px;
    padding:6px 0; border-bottom:1px solid var(--border);
    font-size:12.5px; cursor:pointer;
  }
  .alert-row:last-child{border-bottom:none;}
  .alert-row .main{flex:1; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
  .alert-row .main b{font-weight:600;}
  .alert-row .main .device{color:var(--slate-500);}
  .alert-row .pill{flex:none;}

  .chart-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px; margin-bottom:20px;}
  .bar-row{margin-bottom:8px;}
  .bar-row:last-child{margin-bottom:0;}
  .bar-row .bar-label{display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;}
  .bar-row .bar-track{background:#eef1f6; border-radius:6px; height:10px; overflow:hidden;}
  .bar-row .bar-fill{height:100%; border-radius:6px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(10,21,35,.5); display:flex;
    align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:50; overflow-y:auto;
  }
  .modal{
    background:#fff; border-radius:14px; width:100%; max-width:560px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.35); margin-bottom:5vh;
  }
  .modal-wide{ max-width:760px; }
  .modal-head{
    padding:18px 22px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{font-size:16px;}
  .modal-close{background:none; border:none; font-size:18px; color:var(--slate-500); padding:4px 8px;}
  .modal-body{padding:20px 22px; max-height:64vh; overflow-y:auto;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; margin-bottom:5px; color:var(--navy-800);}
  .field .hint{font-size:11px; color:var(--slate-500); margin-top:4px;}
  .field input, .field select, .field textarea{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    font-size:13px; font-family:inherit; background:#fff; color:var(--navy-900);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--amber); box-shadow:0 0 0 3px rgba(217,154,60,.15);
  }
  .field textarea{resize:vertical; min-height:70px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .checkbox-row{display:flex; align-items:center; gap:8px;}
  .checkbox-row input{width:auto;}

  .tag-chip{
    display:inline-flex; align-items:center; gap:6px; background:#eef1f6; color:var(--navy-800);
    padding:4px 10px; border-radius:20px; font-size:12px; margin:0 6px 6px 0;
  }
  .tag-chip button{background:none; border:none; color:var(--slate-500); font-size:13px; line-height:1;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .toolbar select, .toolbar input[type=text], .toolbar input[type=search]{
    padding:8px 11px; border:1px solid var(--border); border-radius:8px; font-size:12.5px; background:#fff;
  }
  .search-box{position:relative; flex:1; min-width:180px;}
  .search-box input{width:100%;}

  .toast-wrap{position:fixed; bottom:18px; right:18px; z-index:100; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:var(--navy-950); color:#fff; padding:11px 16px; border-radius:9px; font-size:13px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:8px; min-width:220px;
    animation:slidein .18s ease;
  }
  .toast.err{background:var(--red);}
  @keyframes slidein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .device-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .12s;
  }
  .device-card:hover{border-color:var(--amber);}
  .device-card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
  .device-card h4{font-size:15px;}
  .device-card .type{font-size:11px; color:var(--slate-500); margin-top:2px;}
  .device-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px;}
  .kv{display:flex; justify-content:space-between; font-size:12px; padding:4px 0; color:var(--slate-500);}
  .kv b{color:var(--navy-900); font-weight:600;}

  .divider{height:1px; background:var(--border); margin:16px 0;}

  .cat-manage-item{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .cat-manage-item:last-child{border-bottom:none;}

  .icon-btn{background:none; border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:12px; color:var(--slate-500);}
  .icon-btn:hover{color:var(--navy-900); border-color:var(--slate-300);}

  .doc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .doc-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow);}
  .doc-card .fname{font-size:13px; font-weight:600; margin-bottom:3px; word-break:break-word;}
  .doc-card .meta{font-size:11px; color:var(--slate-500); margin-bottom:10px;}
  .doc-card .row-actions{display:flex; gap:6px;}

  @media (max-width: 860px){
    .sidebar{position:fixed; left:-236px; transition:left .2s; z-index:60;}
    .sidebar.open{left:0;}
    .field-row{grid-template-columns:1fr;}
    .content{padding:18px;}
    .topbar{padding:14px 18px;}
  }
  .menu-toggle{display:none; background:none; border:none; font-size:20px; color:var(--navy-900); margin-right:8px;}
  @media (max-width:860px){ .menu-toggle{display:inline-block;} }
</style>
</head>

<script>
/* ============================================================
   FSTD OPS MANAGER — single-file app
   Storage: IndexedDB (persists locally in this browser/profile)
   ============================================================ */

const DB_NAME = 'fstdOpsManager';
const DB_VERSION = 4;
let db;

function openDatabase(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('devices')) d.createObjectStore('devices',{keyPath:'id'});
      if(!d.objectStoreNames.contains('qtg')) d.createObjectStore('qtg',{keyPath:'deviceId'});
      if(!d.objectStoreNames.contains('subjective')) d.createObjectStore('subjective',{keyPath:'deviceId'});
      if(!d.objectStoreNames.contains('findings')) d.createObjectStore('findings',{keyPath:'id'});
      if(!d.objectStoreNames.contains('documents')) d.createObjectStore('documents',{keyPath:'id'});
      if(!d.objectStoreNames.contains('holdItems')) d.createObjectStore('holdItems',{keyPath:'id'});
      if(!d.objectStoreNames.contains('permanentDefects')) d.createObjectStore('permanentDefects',{keyPath:'id'});
      if(!d.objectStoreNames.contains('folders')) d.createObjectStore('folders',{keyPath:'id'});
      if(!d.objectStoreNames.contains('navdata')) d.createObjectStore('navdata',{keyPath:'deviceId'});
      if(!d.objectStoreNames.contains('maintenanceTasks')) d.createObjectStore('maintenanceTasks',{keyPath:'id'});
      if(!d.objectStoreNames.contains('remoteConnections')) d.createObjectStore('remoteConnections',{keyPath:'id'});
      if(!d.objectStoreNames.contains('settings')) d.createObjectStore('settings',{keyPath:'key'});
    };
    req.onsuccess = (e)=>{ db = e.target.result; resolve(db); };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function storeName(name, mode='readonly'){ return db.transaction(name, mode).objectStore(name); }
function getAll(name){ return new Promise((res,rej)=>{ const r=storeName(name).getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function putRec(name, val){ return new Promise((res,rej)=>{ const r=storeName(name,'readwrite').put(val); r.onsuccess=()=>res(val); r.onerror=()=>rej(r.error); }); }
function delRec(name, key){ return new Promise((res,rej)=>{ const r=storeName(name,'readwrite').delete(key); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); }); }
function getRec(name, key){ return new Promise((res,rej)=>{ const r=storeName(name).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addMonths(dateStr, months){
  const d = new Date(dateStr+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  return d.toISOString().slice(0,10);
}
function addDays(dateStr, days){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.toISOString().slice(0,10);
}
function formatHoursHHMM(decimalHours){
  const total = Math.round((decimalHours||0)*60);
  const h = Math.floor(total/60);
  const m = total%60;
  return String(h).padStart(4,'0')+':'+String(m).padStart(2,'0');
}
function parseHoursHHMM(str){
  if(str===undefined || str===null) return 0;
  let s = String(str).trim();
  if(!s) return 0;
  s = s.replace(/[：]/g, ':'); // normalize full-width colon some keyboards/IMEs produce
  const m = s.match(/^(\d{1,6}):(\d{1,2})$/);
  if(m){
    const h = parseInt(m[1],10);
    let mins = parseInt(m[2],10);
    return h + mins/60;
  }
  if(/^\d{1,7}$/.test(s)) return parseInt(s,10); // plain hours, no minutes given
  const f = parseFloat(s.replace(',','.'));
  return isNaN(f) ? NaN : f;
}
function fmtDate(dateStr){
  if(!dateStr) return '—';
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}
function escapeHtml(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function esc(s){ return escapeHtml(s); }

/* ---------------- App lock (local passcode gate — see note in Settings) ---------------- */
async function sha256Hex(str){
  try{
    if(window.crypto && window.crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return 'sha256:' + Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){ /* fall through to fallback below */ }
  // Fallback for contexts without Web Crypto (e.g. some file:// setups). Not cryptographic —
  // fine here since this passcode is a deterrent, not real security (see Settings warning).
  let h1 = 0, h2 = 0;
  for(let i=0;i<str.length;i++){
    const c = str.charCodeAt(i);
    h1 = (Math.imul(31,h1)+c)|0;
    h2 = (Math.imul(33,h2)+c)|0;
  }
  return 'fallback:' + (h1>>>0).toString(16) + (h2>>>0).toString(16);
}
function isUnlockedThisSession(){
  try{ return sessionStorage.getItem('fstdAppUnlocked')==='1'; }catch(e){ return false; }
}
function markUnlockedThisSession(){
  try{ sessionStorage.setItem('fstdAppUnlocked','1'); }catch(e){ /* ignore */ }
}
function lockNow(){
  try{ sessionStorage.removeItem('fstdAppUnlocked'); }catch(e){ /* ignore */ }
  location.reload();
}

  root.id = 'lockScreenRoot';
  root.style.cssText = 'position:fixed;inset:0;background:var(--navy-950);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;';
  root.innerHTML = `

    </div>
  `;
  document.body.appendChild(root);

  const tryUnlock = async ()=>{
    const hash = await sha256Hex(input.value);
    if(hash === STATE.settings.appLockHash){
      markUnlockedThisSession();
      root.remove();
      onUnlock();
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  };
  document.getElementById('lockUnlockBtn').onclick = tryUnlock;

  input.focus();

async function dedupeFolders(){
  // Merges folders that share the same name (can happen when two separately-seeded
  // sessions/backups get combined via Import). Keeps the first occurrence's id,
  // reassigns any documents pointing at the duplicates, then deletes the duplicates.
  const byName = new Map();
  const duplicateIds = [];
  const remap = new Map();
  for(const f of STATE.folders){
    const key = f.name.trim().toLowerCase();
    if(byName.has(key)){
      const keeper = byName.get(key);
      duplicateIds.push(f.id);
      remap.set(f.id, keeper.id);
    } else {
      byName.set(key, f);
    }
  }
  if(duplicateIds.length===0) return;
  for(const doc of STATE.documents){
    if(remap.has(doc.folderId)){
      doc.folderId = remap.get(doc.folderId);
      await putRec('documents', doc);
    }
  }
  for(const id of duplicateIds){
    await delRec('folders', id);
  }
  await loadAll();
}
function folderById(id){ return STATE.folders.find(f=>f.id===id); }
function folderByName(name){ return STATE.folders.find(f=>f.name===name); }

      {key:'annual', name:'12-Month Inspection', kind:'annual'},

      {key:'sem2', name:'Semester 2 Inspection', kind:'semester_fixed'},
      {key:'annual', name:'12-Month Inspection', kind:'annual'}
  ]}
};
async function ensureMaintenanceTasks(){
  let changed = false;
  for(const d of STATE.devices){
    const program = MAINTENANCE_PROGRAMS[d.maintenanceProgram];
    if(!program) continue;
    for(const t of program.tasks){
      const id = d.id+'_'+t.key;
      if(!STATE.maintenanceTasks.some(m=>m.id===id)){
        await putRec('maintenanceTasks', {id, deviceId:d.id, taskKey:t.key, lastCompleted:null, nextDue:null, lastServiceHours:null, notes:'', history:[]});
        changed = true;
      }
    }
  }
  if(changed) await loadAll();
}
function maintTaskDef(taskKey, program){
  const conf = MAINTENANCE_PROGRAMS[program];
  return conf ? conf.tasks.find(t=>t.key===taskKey) : null;
}
function maintDueDate(kind, lastCompleted){
  if(!lastCompleted) return null;
  if(kind==='monthly') return addMonths(lastCompleted,1);
  if(kind==='annual' || kind==='quarterly_fixed' || kind==='semester_fixed') return addMonths(lastCompleted,12);
  return null;
}
function maintStatus(task, device, def){
  if(!def) return 'neutral';
  if(def.kind==='as_required') return 'neutral';
  if(def.kind==='hours'){
    const current = device.currentHours||0;
    const base = task.lastServiceHours===null||task.lastServiceHours===undefined ? null : task.lastServiceHours;
    if(base===null) return 'neutral';
    const remaining = (base + def.hoursInterval) - current;
    if(remaining <= 0) return 'over';
    if(remaining <= 20) return 'soon';
    return 'ok';
  }
  return statusFromDue(task.nextDue);
}

function deviceName(id){
  const d = STATE.devices.find(x=>x.id===id);
  return d ? d.name : '(unassigned)';
}

function statusFromDue(dueDate){
  if(!dueDate) return 'neutral';
  const d = daysUntil(dueDate);
  if(d < 0) return 'over';
  if(d <= STATE.settings.thresholdDays) return 'soon';
  return 'ok';
}
function statusPill(status, dueDate){
  const map = {
    ok:['pill-ok','On track'], soon:['pill-soon','Due soon'], over:['pill-over','Overdue'],
    neutral:['pill-neutral','Not scheduled']
  };
  const [cls,label] = map[status];
  let extra = '';
  if(dueDate){
    const d = daysUntil(dueDate);
    extra = status==='over' ? ` (${Math.abs(d)}d overdue)` : status==='soon' ? ` (${d}d left)` : '';
  }
  return `<span class="pill ${cls}"><span class="pill-dot"></span>${label}${extra}</span>`;
}

function renderDonutChart(data){
  const total = data.reduce((s,d)=>s+d.value,0);
  if(total===0) return `<div style="font-size:12.5px;color:var(--slate-500);">No data yet.</div>`;
  let acc = 0;
  const stops = data.filter(d=>d.value>0).map(d=>{
    const start = (acc/total*360).toFixed(2);
    acc += d.value;
    const end = (acc/total*360).toFixed(2);
    return `${d.color} ${start}deg ${end}deg`;
  }).join(', ');
  return `
    <div style="display:flex; align-items:center; gap:22px; flex-wrap:wrap;">
      <div style="width:110px;height:110px;border-radius:50%;background:conic-gradient(${stops});position:relative;flex:none;">
        <div style="position:absolute;inset:16px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--navy-900);">${total}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:7px;min-width:120px;">
        ${data.map(d=>`<div style="display:flex;align-items:center;gap:8px;font-size:12px;"><span style="width:9px;height:9px;border-radius:3px;background:${d.color};flex:none;"></span><span>${esc(d.label)}</span><span class="mono" style="margin-left:auto;color:var(--slate-500);">${d.value}</span></div>`).join('')}
      </div>
    </div>
  `;
}
function renderBarChart(data, color){
  if(data.length===0 || data.every(d=>d.value===0)) return `<div style="font-size:12.5px;color:var(--slate-500);">No data yet.</div>`;
  const max = Math.max(1, ...data.map(d=>d.value));
  return data.map(d=>`
    <div class="bar-row">
      <div class="bar-label"><span>${esc(d.label)}</span><span class="mono" style="color:var(--slate-500);">${d.value}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(d.value/max*100).toFixed(1)}%; background:${d.color||color};"></div></div>
    </div>
  `).join('');
}

        <div class="panel-head"><h3>Findings by status</h3></div>
        <div class="panel-body" id="chartStatus"></div>
      </div>

        <div class="panel-head"><h3>Open findings by category</h3></div>

      </div>
    </div>
  `;

  document.getElementById('alertsPanelHead').onclick = ()=>{
    dashboardAlertsOpen = !dashboardAlertsOpen;
    renderDashboard();
  };

  const alertList = document.getElementById('alertList');
  if(items.length===0){
    alertList.innerHTML = `<div class="empty"><div class="ic">&#9989;</div><h4>Nothing due right now</h4><div>All QTGs, subjective tests, hold items and findings are within schedule.</div></div>`;
  } else {
    alertList.innerHTML = items.slice(0,20).map(it=>`
      <div class="alert-row">
        <div class="main"><b>${it.type}${it.label? ' — '+esc(it.label):''}</b> <span class="device">— ${esc(it.device)} &middot; due ${fmtDate(it.due)}</span></div>
        ${statusPill(it.status, it.due)}
      </div>
    `).join('');
    alertList.querySelectorAll('.alert-row').forEach((row,i)=>{
      row.onclick = ()=> setView(items[i].nav);
    });
  }

  // Findings by status (donut)
  const statusColors = {Open:'var(--red)', 'In Progress':'var(--amber)', 'Awaiting Authority':'#94a3b8', Closed:'var(--green)'};
  const statusCounts = {Open:0, 'In Progress':0, 'Awaiting Authority':0, Closed:0};
  STATE.findings.forEach(f=>{ if(statusCounts[f.status]!==undefined) statusCounts[f.status]++; });
  document.getElementById('chartStatus').innerHTML = renderDonutChart(
    Object.keys(statusCounts).map(k=>({label:k, value:statusCounts[k], color:statusColors[k]}))
  );

  // Open findings by category (bar)
  const catCounts = {};
  STATE.findings.filter(f=>f.status!=='Closed').forEach(f=>{ catCounts[f.category] = (catCounts[f.category]||0)+1; });
  const catData = Object.keys(catCounts).map(k=>({label:k, value:catCounts[k]})).sort((a,b)=>b.value-a.value).slice(0,8);
  document.getElementById('chartCategory').innerHTML = renderBarChart(catData, 'var(--amber)');

  openHil.forEach(h=>{ devCounts[h.deviceId] = (devCounts[h.deviceId]||0)+1; });
  const devData = Object.keys(devCounts).map(id=>({label:deviceName(id), value:devCounts[id]})).sort((a,b)=>b.value-a.value);
  document.getElementById('chartDevice').innerHTML = renderBarChart(devData, 'var(--navy-700)');
}

function cycleForm(kind, deviceId, renewMode){
  const label = kind==='qtg' ? 'QTG' : 'Subjective test';
  const store = STATE[kind];
  const existing = store.find(r=>r.deviceId===deviceId);
  const defaultLast = renewMode ? todayStr() : (existing?existing.lastCompleted:todayStr());
  openModal({
    title: `${label} — ${esc(deviceName(deviceId))}`,
    bodyHtml: `
      <form id="cycleFormEl">
        <div class="field-row">
          <div class="field"><label>Last completed *</label><input type="date" name="lastCompleted" required value="${defaultLast}"></div>
          <div class="field"><label>Next due</label><input type="date" name="nextDue" value="${existing&&!renewMode?existing.nextDue:addMonths(defaultLast,3)}">
            <div class="hint">Auto-set to +3 months; override if the authority grants an extension.</div>
          </div>
        </div>
        <div class="field"><label>Notes</label><textarea name="notes" placeholder="e.g. re-run item 4.2 after motion tuning">${existing?esc(existing.notes||''):''}</textarea></div>
      </form>
      ${existing&&existing.history&&existing.history.length? `
        <div class="divider"></div>
        <div style="font-size:12px;font-weight:600;margin-bottom:6px;">History</div>
        ${existing.history.slice().reverse().map(h=>`<div class="kv"><span>${fmtDate(h.date)}</span><b>${esc(h.notes||'Completed')}</b></div>`).join('')}
      ` : ''}
    `,
    footHtml: `
      <button class="btn btn-outline" id="cancelBtn">Cancel</button>
      <button class="btn btn-primary" id="saveCycleBtn">Save</button>
    `,
    onMount: ()=>{
      document.getElementById('cancelBtn').onclick = closeModal;
      // live-recompute next due when last completed changes, unless user already edited next due manually
      const form = document.getElementById('cycleFormEl');
      let userTouchedNextDue = false;
      form.nextDue.addEventListener('input', ()=> userTouchedNextDue = true);
      form.lastCompleted.addEventListener('input', ()=>{
        if(!userTouchedNextDue) form.nextDue.value = addMonths(form.lastCompleted.value, 3);
      });
      document.getElementById('saveCycleBtn').onclick = async ()=>{
        if(!form.reportValidity()) return;
        const fd = new FormData(form);
        const rec = existing || {deviceId, history:[]};
        if(!rec.history) rec.history = [];
        if(renewMode && rec.lastCompleted){
          rec.history.push({date: rec.lastCompleted, notes: rec.notes||''});
        }
        rec.lastCompleted = fd.get('lastCompleted');
        rec.nextDue = fd.get('nextDue') || addMonths(rec.lastCompleted,3);
        rec.notes = fd.get('notes').trim();
        await putRec(kind, rec);
        await loadAll(); closeModal(); renderView(kind); toast(`${label} record saved`);
      };
    }
  });
}

/* ================= HOLD ITEM LIST (HIL) ================= */
const HIL_CATEGORIES = {
  MIN: {label:'Minor (MIN)', days:90},
  MAJ: {label:'Major (MAJ)', days:30},
  OBS: {label:'Observation (OBS)', days:null}
};
function hilStatus(h){ return h.closureDate ? 'Closed' : 'Open'; }
function hilDueDate(reportDate, category){
  const conf = HIL_CATEGORIES[category];
  if(!conf || conf.days===null || !reportDate) return null;
  return addDays(reportDate, conf.days);
}
function hilCategoryPill(category){
  if(!category) return '<span class="pill pill-neutral">—</span>';
  const map = {MIN:'pill-soon', MAJ:'pill-over', OBS:'pill-neutral'};
  return `<span class="pill ${map[category]||'pill-neutral'}">${category}</span>`;
}

let hilFilters = {device:'all', status:'all', category:'all'};

function renderHoldItems(){
  const c = document.getElementById('content');
  if(STATE.devices.length===0){
    c.innerHTML = `<div class="empty"><div class="ic">&#128203;</div><h4>No devices yet</h4><div>Add an FSTD first, then log deferred defects here.</div></div>`;
    return;
  }
  c.innerHTML = `
    <div class="toolbar">
      <select id="hDevice">
        <option value="all">All devices</option>
        ${STATE.devices.map(d=>`<option value="${d.id}" ${hilFilters.device===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
      </select>
      <select id="hStatus">
        <option value="all">All statuses</option>
        <option ${hilFilters.status==='Open'?'selected':''}>Open</option>
        <option ${hilFilters.status==='Closed'?'selected':''}>Closed</option>
      </select>
      <select id="hCategory">
        <option value="all">All categories</option>
        ${Object.keys(HIL_CATEGORIES).map(cat=>`<option value="${cat}" ${hilFilters.category===cat?'selected':''}>${HIL_CATEGORIES[cat].label}</option>`).join('')}
      </select>
    </div>
    <div class="panel"><div class="panel-body" style="padding:0;" id="hilTableWrap"></div></div>
  `;
  document.getElementById('hDevice').onchange = e=>{ hilFilters.device=e.target.value; renderHoldItems(); };
  document.getElementById('hStatus').onchange = e=>{ hilFilters.status=e.target.value; renderHoldItems(); };
  document.getElementById('hCategory').onchange = e=>{ hilFilters.category=e.target.value; renderHoldItems(); };

  let list = [...STATE.holdItems];
  if(hilFilters.device!=='all') list = list.filter(h=>h.deviceId===hilFilters.device);
  if(hilFilters.status!=='all') list = list.filter(h=>hilStatus(h)===hilFilters.status);
  if(hilFilters.category!=='all') list = list.filter(h=>h.defectCategory===hilFilters.category);
  list.sort((a,b)=> (b.reportDate||'').localeCompare(a.reportDate||''));

  const wrap = document.getElementById('hilTableWrap');
  if(list.length===0){
    wrap.innerHTML = `<div class="empty"><div class="ic">&#128203;</div><h4>No hold items match this view</h4></div>`;
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Item #</th><th>Device</th><th>ATL log/item</th><th>Description</th><th>Report date</th><th>Category / Due</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${list.map(h=>{
          const status = hilStatus(h);
          const overdue = status==='Open' && h.dueDate && daysUntil(h.dueDate)<0;
          return `<tr>
            <td class="mono">Item ${h.seq||0}</td>

/* ================= MAINTENANCE ================= */
let maintFilters = {device:'all', status:'all'};

function renderMaintenance(){
  const c = document.getElementById('content');
  const devicesWithProgram = STATE.devices.filter(d=>d.maintenanceProgram);
  if(devicesWithProgram.length===0){
    c.innerHTML = `<div class="empty"><div class="ic">&#128295;</div><h4>No maintenance programs assigned</h4><div>Open a device under FSTD Devices &rarr; Edit and choose a maintenance program to generate its task list here.</div></div>`;
    return;
  }
  c.innerHTML = `
    <div class="toolbar">
      <select id="mDevice">
        <option value="all">All devices</option>
        ${devicesWithProgram.map(d=>`<option value="${d.id}" ${maintFilters.device===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
      </select>
      <select id="mStatus">
        <option value="all">All statuses</option>
        <option value="over" ${maintFilters.status==='over'?'selected':''}>Overdue</option>
        <option value="soon" ${maintFilters.status==='soon'?'selected':''}>Due soon</option>
        <option value="ok" ${maintFilters.status==='ok'?'selected':''}>On track</option>
      </select>
    </div>
    <div class="panel"><div class="panel-body" style="padding:0;" id="maintTableWrap"></div></div>
  `;
  document.getElementById('mDevice').onchange = e=>{ maintFilters.device=e.target.value; renderMaintenance(); };
  document.getElementById('mStatus').onchange = e=>{ maintFilters.status=e.target.value; renderMaintenance(); };

  let rows = [];
  devicesWithProgram.forEach(d=>{
    const program = MAINTENANCE_PROGRAMS[d.maintenanceProgram];
    program.tasks.forEach(def=>{
      const task = STATE.maintenanceTasks.find(m=>m.deviceId===d.id && m.taskKey===def.key);
      if(!task) return;
      rows.push({device:d, def, task, status: maintStatus(task, d, def)});
    });
  });
  if(maintFilters.device!=='all') rows = rows.filter(r=>r.device.id===maintFilters.device);
  if(maintFilters.status!=='all') rows = rows.filter(r=>r.status===maintFilters.status);

  const wrap = document.getElementById('maintTableWrap');
  if(rows.length===0){
    wrap.innerHTML = `<div class="empty"><div class="ic">&#128295;</div><h4>No maintenance tasks match this view</h4></div>`;
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Device</th><th>Task</th><th>Last completed</th><th>Next due / Hours</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${rows.map(r=>{
          const {device, def, task, status} = r;
          let dueCell = '—';
          if(def.kind==='as_required'){
            dueCell = '<span class="pill pill-neutral">On demand</span>';
          } else if(def.kind==='hours'){
            const base = task.lastServiceHours;
            dueCell = base===null||base===undefined ? '—' : `<span class="mono">${formatHoursHHMM(device.currentHours||0)} / ${formatHoursHHMM(base+def.hoursInterval)} hrs</span>`;
          } else {
            dueCell = task.nextDue ? `<span class="mono">${fmtDate(task.nextDue)}</span>` : '—';
          }
          return `<tr>
            <td><b>${esc(device.name)}</b></td>
            <td>${esc(def.name)}</td>
            <td class="mono">${def.kind==='hours' ? (task.lastServiceHours!=null?formatHoursHHMM(task.lastServiceHours):'—') : (task.lastCompleted?fmtDate(task.lastCompleted):'—')}</td>
            <td>${dueCell}</td>
            <td>${def.kind==='as_required'?'<span class="pill pill-neutral">—</span>':statusPill(status, def.kind==='hours'?null:task.nextDue)}</td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="btn btn-outline btn-sm" data-renew="${task.id}">${def.kind==='as_required'?'Log entry':'Renew'}</button>
              <button class="btn btn-ghost btn-sm" data-edit="${task.id}">Edit</button>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('[data-renew]').forEach(btn=> btn.onclick = ()=> maintenanceTaskForm(btn.dataset.renew, true));
  wrap.querySelectorAll('[data-edit]').forEach(btn=> btn.onclick = ()=> maintenanceTaskForm(btn.dataset.edit, false));
}

function maintenanceTaskForm(taskId, renewMode){
  const task = STATE.maintenanceTasks.find(m=>m.id===taskId);
  const device = STATE.devices.find(d=>d.id===task.deviceId);
  const def = maintTaskDef(task.taskKey, device.maintenanceProgram);
  const defaultLast = renewMode ? todayStr() : (task.lastCompleted||todayStr());

  let bodyHtml = `<form id="maintFormEl">`;
  if(def.kind==='hours'){
    bodyHtml += `
      <div class="field"><label>Current simulator hours</label><div class="mono" style="padding:8px 0;">${formatHoursHHMM(device.currentHours||0)} hrs <span class="hint" style="display:inline;">(update in FSTD Devices &rarr; Edit)</span></div></div>
      <div class="field"><label>Hours reading at this service *</label><input type="text" name="lastServiceHours" required placeholder="e.g. 1024:30" value="${renewMode?formatHoursHHMM(device.currentHours||0):(task.lastServiceHours!=null?formatHoursHHMM(task.lastServiceHours):'')}"><div class="hint">Format HHHH:MM (or just a plain number of hours).</div></div>
      <div class="field"><label>Service date</label><input type="date" name="lastCompleted" value="${defaultLast}"></div>
    `;
  } else if(def.kind==='as_required'){
    bodyHtml += `
      <div class="field"><label>Date of latest entry</label><input type="date" name="lastCompleted" value="${defaultLast}"></div>
    `;
  } else {
    bodyHtml += `
      <div class="field-row">
        <div class="field"><label>Last completed *</label><input type="date" name="lastCompleted" required value="${defaultLast}"></div>
        <div class="field"><label>Next due</label><input type="date" name="nextDue" value="${task.nextDue&&!renewMode?task.nextDue:maintDueDate(def.kind,defaultLast)}">
          <div class="hint">Auto-set from the task cycle; override if needed.</div>
        </div>
      </div>
    `;
  }
  bodyHtml += `<div class="field"><label>Notes</label><textarea name="notes" placeholder="Work performed, reference, technician...">${renewMode?'':esc(task.notes||'')}</textarea></div></form>`;
  if(task.history && task.history.length){
    bodyHtml += `<div class="divider"></div><div style="font-size:12px;font-weight:600;margin-bottom:6px;">History</div>`;
    bodyHtml += task.history.slice().reverse().map(h=>`<div class="kv"><span>${fmtDate(h.date)}</span><b>${esc(h.notes||'Completed')}</b></div>`).join('');
  }
  bodyHtml += `
    <div class="divider"></div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
      <div style="font-size:12px;font-weight:600;color:var(--navy-800);">Attachments (PDF or photo)</div>
      <label class="btn btn-outline btn-sm" style="margin:0;">+ Attach file<input type="file" id="maintFileInput" accept="application/pdf,image/*" style="display:none;"></label>
    </div>
    <div id="maintAttachList">${renderMaintAttachmentList(task.id)}</div>
  `;

  openModal({
    title: `${esc(def.name)} — ${esc(device.name)}`,
    bodyHtml,
    footHtml: `<button class="btn btn-outline" id="cancelBtn">Cancel</button><button class="btn btn-primary" id="saveMaintBtn">Save</button>`,
    onMount: ()=>{
      document.getElementById('cancelBtn').onclick = closeModal;
      const form = document.getElementById('maintFormEl');
      if(def.kind!=='hours' && def.kind!=='as_required'){
        let userTouchedNextDue = false;
        form.nextDue.addEventListener('input', ()=> userTouchedNextDue = true);
        form.lastCompleted.addEventListener('input', ()=>{
          if(!userTouchedNextDue) form.nextDue.value = maintDueDate(def.kind, form.lastCompleted.value);
        });
      }
      const maintFileInput = document.getElementById('maintFileInput');
      if(maintFileInput){
        maintFileInput.onchange = ()=>{
          const file = maintFileInput.files[0];
          if(!file) return;
          const reader = new FileReader();
          reader.onload = async ()=>{
            const maintFolder = folderByName('Maintenance');
            const doc = {
              id: uid('doc'), name: file.name, size: file.size, mime: file.type,
              folderId: maintFolder ? maintFolder.id : null, deviceId: task.deviceId,
              maintenanceTaskId: task.id, notes: '', uploadDate: todayStr(), dataUrl: reader.result
            };
            await putRec('documents', doc);
            await loadAll();
            document.getElementById('maintAttachList').innerHTML = renderMaintAttachmentList(task.id);
            wireMaintAttachmentButtons(task.id);
            toast('File attached');
          };
          reader.readAsDataURL(file);
        };
      }
      wireMaintAttachmentButtons(task.id);
      document.getElementById('saveMaintBtn').onclick = async ()=>{
        if(!form.reportValidity()) return;
        const fd = new FormData(form);
        let parsedServiceHours = null;
        if(def.kind==='hours'){
          parsedServiceHours = parseHoursHHMM(fd.get('lastServiceHours'));
          if(isNaN(parsedServiceHours)){ toast('Enter hours as HHHH:MM (e.g. 1024:30) or a plain number', true); return; }
        }
        if(!task.history) task.history = [];
        if(renewMode && task.lastCompleted){
          task.history.push({date: task.lastCompleted, notes: task.notes||''});
        }
        if(def.kind==='hours'){
          task.lastServiceHours = parsedServiceHours;
          task.lastCompleted = fd.get('lastCompleted') || todayStr();
        } else if(def.kind==='as_required'){
          task.lastCompleted = fd.get('lastCompleted') || todayStr();
        } else {
          task.lastCompleted = fd.get('lastCompleted');
          task.nextDue = fd.get('nextDue') || maintDueDate(def.kind, task.lastCompleted);
        }
        task.notes = fd.get('notes').trim();
        await putRec('maintenanceTasks', task);
        await loadAll(); closeModal(); renderView('maintenance'); toast('Maintenance record saved');
      };
    }
  });
}

function renderMaintAttachmentList(taskId){
  const docs = STATE.documents.filter(d=>d.maintenanceTaskId===taskId);
  if(docs.length===0) return `<div style="font-size:12px;color:var(--slate-500);">No files attached yet.</div>`;
  return docs.map(d=>`
    <div class="list-row">
      <div>
        <div style="font-weight:600;font-size:12.5px;">${esc(d.name)}</div>
        <div style="font-size:11px;color:var(--slate-500);">${fmtDate(d.uploadDate)} &middot; ${(d.size/1024).toFixed(0)} KB</div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-outline btn-sm" data-mdl="${d.id}">Download</button>
        <button class="btn btn-ghost btn-sm" data-mrm="${d.id}">Remove</button>
      </div>
    </div>
  `).join('');
}
function wireMaintAttachmentButtons(taskId){
  const list = document.getElementById('maintAttachList');
  if(!list) return;
  list.querySelectorAll('[data-mdl]').forEach(btn=> btn.onclick = ()=> downloadDocument(btn.dataset.mdl));
  list.querySelectorAll('[data-mrm]').forEach(btn=> btn.onclick = async ()=>{
    if(confirm('Remove this file?')){
      await delRec('documents', btn.dataset.mrm);
      await loadAll();
      document.getElementById('maintAttachList').innerHTML = renderMaintAttachmentList(taskId);
      wireMaintAttachmentButtons(taskId);
      toast('File removed');
    }
  });
}

/* ================= FINDINGS (Authority + Internal Audit share this layout) ================= */
let findingsFilters = {
  authority: {status:'all', category:'all', device:'all', cls:'all', kind:'all'},
  internal:  {status:'all', category:'all', device:'all', cls:'all', kind:'all'}
};
const FINDING_CLASSES = ['A','B','C','D','E'];
function classPill(cls){
  if(!cls) return '<span class="pill pill-neutral">—</span>';
  const map = {A:'pill-over', B:'pill-over', C:'pill-soon', D:'pill-neutral', E:'pill-ok'};
  return `<span class="pill ${map[cls]||'pill-neutral'}">Class ${esc(cls)}</span>`;
}
function kindPill(kind){
  if(!kind) return '<span class="pill pill-neutral">—</span>';
  return `<span class="pill pill-neutral">${kind==='Subjective'?'SUB':'OBJ'}</span>`;
}
function findingSource(f){ return f.source==='internal' ? 'internal' : 'authority'; }
function findingRefPrefix(source){ return source==='internal' ? 'AUD' : 'FIND'; }

function renderFindings(){ renderFindingsPage('authority'); }
function renderInternalFindings(){ renderFindingsPage('internal'); }

      <select id="fCategory">
        <option value="all">All categories</option>
        ${cats.map(cat=>`<option ${filter.category===cat?'selected':''}>${esc(cat)}</option>`).join('')}

      <select id="fDevice">
        <option value="all">All devices</option>
        <option value="general">General (no device)</option>

      </select>
      <select id="fClass">
        <option value="all">All classes</option>
        ${FINDING_CLASSES.map(cl=>`<option ${filter.cls===cl?'selected':''}>${cl}</option>`).join('')}

  `;

  document.getElementById('fDevice').value = filter.device;
  document.getElementById('fClass').value = filter.cls;
  document.getElementById('fKind').value = filter.kind;
  document.getElementById('fStatus').onchange = e=>{ filter.status=e.target.value; renderFindingsPage(source); };
  document.getElementById('fCategory').onchange = e=>{ filter.category=e.target.value; renderFindingsPage(source); };
  document.getElementById('fDevice').onchange = e=>{ filter.device=e.target.value; renderFindingsPage(source); };
  document.getElementById('fClass').onchange = e=>{ filter.cls=e.target.value; renderFindingsPage(source); };
  document.getElementById('fKind').onchange = e=>{ filter.kind=e.target.value; renderFindingsPage(source); };

  let list = STATE.findings.filter(f=>findingSource(f)===source);

  if(filter.device!=='all'){
    list = filter.device==='general' ? list.filter(f=>!f.deviceId) : list.filter(f=>f.deviceId===filter.device);
  }
  if(filter.cls!=='all') list = list.filter(f=>f.cls===filter.cls);
  if(filter.kind!=='all') list = list.filter(f=>f.kind===filter.kind);
  list.sort((a,b)=> (b.dateRaised||'').localeCompare(a.dateRaised||''));

  const wrap = document.getElementById('findingsTableWrap');
  if(list.length===0){

    return;
  }
  wrap.innerHTML = `
    <table>
      <thead><tr><th>Ref</th><th>Title</th><th>Category</th><th>Class</th><th>Type</th><th>Device</th><th>Raised</th><th>Due</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${list.map((f,i)=>{

            <td><b>${esc(f.title)}</b>${f.authority?`<div style="font-size:11px;color:var(--slate-500);">${esc(f.authority)}</div>`:''}</td>
            <td>${esc(f.category)}</td>
            <td>${classPill(f.cls)}</td>
            <td>${kindPill(f.kind)}</td>
            <td>${f.deviceId?esc(deviceName(f.deviceId)):'General'}</td>

  wrap.querySelectorAll('[data-info]').forEach(btn=> btn.onclick = ()=> findingInfoModal(btn.dataset.info));

/* ================= DOCUMENTS (folders) ================= */
let docViewState = { folderId: null };
let docDeviceFilter = 'all';
const FOLDER_ICON_CHOICES = ['📁','📘','📗','📕','📈','✍️','🛠️','🏛️','🔒','🗂️','📄','✈️','🎯','🧾','📦'];

function renderDocuments(){
  const c = document.getElementById('content');
  if(!docViewState.folderId){
    renderFolderGrid(c);
  } else {
    renderFolderDetail(c, docViewState.folderId);
  }
}

function renderFolderGrid(c){
  const folders = [...STATE.folders].sort((a,b)=> (b.standard?1:0)-(a.standard?1:0) || a.name.localeCompare(b.name));
  c.innerHTML = `<div class="doc-grid" id="folderGrid"></div>`;
  const grid = document.getElementById('folderGrid');
  if(folders.length===0){
    grid.parentElement.innerHTML = `<div class="empty"><div class="ic">&#128193;</div><h4>No folders yet</h4></div>`;
    return;
  }
  grid.innerHTML = folders.map(f=>{
    const count = STATE.documents.filter(d=>d.folderId===f.id).length;
    return `
    <div class="doc-card" data-folder="${f.id}" style="cursor:pointer;">
      <div style="font-size:34px; margin-bottom:8px;">${f.icon||'📁'}</div>
      <div class="fname">${esc(f.name)}</div>
      <div class="meta">${count} document${count===1?'':'s'}${f.standard?'':' &middot; custom'}</div>
      ${f.standard?'':'<div class="row-actions"><button class="btn btn-ghost btn-sm" data-delfolder="'+f.id+'">Delete</button></div>'}
    </div>`;
  }).join('');
  grid.querySelectorAll('[data-folder]').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('[data-delfolder]')) return;
      docViewState.folderId = card.dataset.folder;
      renderView('documents');
    });
  });
  grid.querySelectorAll('[data-delfolder]').forEach(btn=>{
    btn.onclick = async (e)=>{
      e.stopPropagation();
      const fid = btn.dataset.delfolder;
      const count = STATE.documents.filter(d=>d.folderId===fid).length;
      if(count>0){ toast('Move or delete the documents inside this folder first', true); return; }
      if(confirm('Delete this folder?')){ await delRec('folders', fid); await loadAll(); renderView('documents'); toast('Folder deleted'); }
    };
  });
}

function renderFolderDetail(c, folderId){
  const folder = folderById(folderId);
  if(!folder){ docViewState.folderId = null; renderView('documents'); return; }
  c.innerHTML = `
    <div class="toolbar" style="justify-content:space-between;">
      <button class="btn btn-outline btn-sm" id="backToFolders">&larr; All folders</button>
      <select id="dDeviceFilter" style="margin-left:auto;">
        <option value="all">All devices</option>
        <option value="general">General (no device)</option>
        ${STATE.devices.map(d=>`<option value="${d.id}" ${docDeviceFilter===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
      </select>
    </div>

      <div class="fname">${esc(d.name)}</div>
      <div class="meta">${d.deviceId?esc(deviceName(d.deviceId)):'General'}${d.maintenanceTaskId?linkedMaintLabel(d.maintenanceTaskId):''}${d.findingId?' &middot; linked to a finding':''}<br>${fmtDate(d.uploadDate)} &middot; ${(d.size/1024).toFixed(0)} KB</div>
      <div class="row-actions">

    if(confirm('Delete this document?')){ await delRec('documents', btn.dataset.del); await loadAll(); renderView('documents'); toast('Document deleted'); }

function linkedMaintLabel(taskId){
  const task = STATE.maintenanceTasks.find(m=>m.id===taskId);
  if(!task) return '';
  const device = STATE.devices.find(d=>d.id===task.deviceId);
  const def = device ? maintTaskDef(task.taskKey, device.maintenanceProgram) : null;
  return def ? ' &middot; linked to ' + esc(def.name) : '';
}

function downloadDocument(id){
  const doc = STATE.documents.find(d=>d.id===id);
  if(!doc) return;
  const a = document.createElement('a');
  a.href = doc.dataUrl;
  a.download = doc.name;
  document.body.appendChild(a); a.click(); a.remove();
}

async function copyToClipboard(text, label){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast((label||'Value')+' copied');
  }catch(e){
    toast('Could not copy — select and copy manually', true);
  }
}

function renderSettings(){

      <div class="panel-body">
        <p style="color:var(--slate-500); font-size:12.5px; margin-top:0;">
          A local passcode screen shown before the app opens. This is a deterrent for shared computers, <b>not real security</b> —
          it's client-side only and doesn't encrypt anything. If you host this file online, protect it at the hosting level too
          (private hosting, VPN, or a password-protected host) rather than relying on this alone.
        </p>
        <p style="color:var(--red); font-size:12px; background:var(--red-soft); padding:8px 10px; border-radius:8px;">

          <div class="field"><label>${s.appLockHash?'Change passcode':'Set passcode'}</label><input type="password" id="lockPasscodeNew" placeholder="New passcode"></div>
          <div class="field"><label>Confirm</label><input type="password" id="lockPasscodeConfirm" placeholder="Confirm passcode"></div>
        </div>
        <button class="btn btn-primary" id="saveLockBtn">Save app lock settings</button>
        ${s.appLockEnabled && s.appLockHash ? '<button class="btn btn-outline" id="lockNowBtn">Lock now</button>' : ''}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Finding categories</h3></div>
      <div class="panel-body">
        <div id="catList"></div>
        <div class="field-row" style="margin-top:12px;">
          <div class="field" style="margin-bottom:0;"><input id="newCatInput" placeholder="New category name"></div>
          <div class="field" style="margin-bottom:0;"><button class="btn btn-outline" id="addCatBtn" style="width:100%;">+ Add category</button></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h3>Backup &amp; restore</h3></div>
      <div class="panel-body">
        <p style="color:var(--slate-500); font-size:12.5px; margin-top:0;">All data lives only in this browser's local storage. Export a backup regularly and before clearing browser data.</p>
        <button class="btn btn-outline" id="exportBtn">&#8595; Export backup (.json)</button>
        <button class="btn btn-outline" id="importBtn">&#8593; Import backup</button>
        <input type="file" id="importFile" accept="application/json" style="display:none;">
        <div class="divider"></div>
        <button class="btn btn-danger" id="wipeBtn">Erase all data</button>
      </div>
    </div>
  `;

  document.getElementById('saveSettingsBtn').onclick = async ()=>{
    s.atoName = document.getElementById('atoNameInput').value.trim() || 'My ATO';
    s.thresholdDays = parseInt(document.getElementById('thresholdInput').value,10) || 30;
    await putRec('settings', s);
    await loadAll(); renderSettings(); updateSidebarBadges(); toast('Settings saved');
  };

  document.getElementById('saveLockBtn').onclick = async ()=>{
    const enabled = document.getElementById('lockEnabledInput').checked;
    const pass1 = document.getElementById('lockPasscodeNew').value;
    const pass2 = document.getElementById('lockPasscodeConfirm').value;
    if(enabled && !s.appLockHash && !pass1){
      toast('Set a passcode to enable the lock', true); return;
    }
    if(pass1 || pass2){
      if(pass1 !== pass2){ toast('Passcodes do not match', true); return; }
      if(pass1.length < 4){ toast('Use at least 4 characters', true); return; }
      s.appLockHash = await sha256Hex(pass1);
    }
    s.appLockEnabled = enabled;
    await putRec('settings', s);
    await loadAll(); renderSettings(); toast('App lock settings saved');
  };
  const lockNowBtn = document.getElementById('lockNowBtn');
  if(lockNowBtn) lockNowBtn.onclick = ()=> lockNow();

  const catList = document.getElementById('catList');
  function drawCats(){
    catList.innerHTML = s.findingCategories.map((cat,i)=>`
      <div class="cat-manage-item">
        <span>${esc(cat)}</span>
        <button class="icon-btn" data-rmcat="${i}">Remove</button>
      </div>
    `).join('') || '<div style="color:var(--slate-500);font-size:12.5px;">No categories yet.</div>';
    catList.querySelectorAll('[data-rmcat]').forEach(btn=>{
      btn.onclick = async ()=>{
        s.findingCategories.splice(parseInt(btn.dataset.rmcat,10),1);
        await putRec('settings', s); await loadAll(); renderSettings(); toast('Category removed');
      };
    });
  }
  drawCats();
  document.getElementById('addCatBtn').onclick = async ()=>{
    const input = document.getElementById('newCatInput');
    const val = input.value.trim();
    if(!val) return;
    if(s.findingCategories.includes(val)){ toast('Category already exists', true); return; }
    s.findingCategories.push(val);
    await putRec('settings', s); await loadAll(); renderSettings(); toast('Category added');
  };

  document.getElementById('exportBtn').onclick = async ()=>{
    const backup = {
      exportedAt: new Date().toISOString(),
      devices: STATE.devices, qtg: STATE.qtg, subjective: STATE.subjective,
      findings: STATE.findings, documents: STATE.documents, holdItems: STATE.holdItems, permanentDefects: STATE.permanentDefects,
      folders: STATE.folders, navdata: STATE.navdata, maintenanceTasks: STATE.maintenanceTasks,
      remoteConnections: STATE.remoteConnections,
      settings: STATE.settings
    };
    const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `fstd-ops-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Backup exported');
  };
  document.getElementById('importBtn').onclick = ()=> document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!confirm('Importing will merge/overwrite records with matching IDs. Continue?')) return;
    const text = await file.text();
    try{
      const data = JSON.parse(text);
      await importBackupData(data);
      await dedupeFolders();
      renderSettings(); updateSidebarBadges(); toast('Backup imported');
    }catch(err){
      toast('Invalid backup file', true);
    }
  };
  document.getElementById('wipeBtn').onclick = async ()=>{
    if(!confirm('This will permanently erase ALL data in this app. This cannot be undone. Continue?')) return;
    if(!confirm('Are you absolutely sure? Consider exporting a backup first.')) return;
    for(const key of ['devices','qtg','subjective','findings','documents','holdItems','permanentDefects','folders','navdata','maintenanceTasks','remoteConnections']){
      const all = await getAll(key);
      for(const rec of all) await delRec(key, rec.id || rec.deviceId);
    }
    await loadAll(); renderView('settings'); toast('All data erased');
  };
}

994ni", "history": [], "lastCompleted": "2026-06-01", "nextDue": "2026-10-01", "notes": ""}, {"deviceId": "dev_msr9pvwotqdaz2", "history": [], "lastCompleted": "2026-06-09", "nextDue": "2026-10-01", "notes": ""}], "subjective": [{"deviceId": "dev_msr9o7w9uqym5s", "history": [], "lastCompleted": "2026-05-26", "nextDue": "2026-08-31", "notes": ""}, {"deviceId": "dev_msr9op3dkztifr", "history": [], "lastCompleted": "2026-05-27", "nextDue": "2026-08-31", "notes": ""}, {"deviceId": "dev_msr9p8ox9zcgst", "history": [], "lastCompleted": "2026-07-16", "nextDue": "2026-10-31", "notes": ""}, {"deviceId": "dev_msr9pj9su994ni", "history": [], "lastCompleted": "2026-07-17", "nextDue": "2026-10-31", "notes": ""}, {"deviceId": "dev_msr9pvwotqdaz2", "history": [], "lastCompleted": "2026-06-09", "nextDue": "2026-09-30", "notes": ""}], "findings": [{"id": "find_msr9t048erno57", "seq": 1, "title": "SUB.B1 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 3. Visual System — d.1 Visual system free of discontinuities", "category": "Visual System", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The visual system does not have the projector \"blending/overlap\" correctly adjusted, particularly between the projector covering the central and right areas of the screen, since a double image is visible. This effect causes confusion, especially during the approach phase with wind from the left, which results in the landing runway appearing within the overlap zone.\n\nThis same defect was already detected during the previous evaluation and was assumed to have been corrected based on the evidence submitted at the time. There is no evidence that the simulator's preventive maintenance procedures include a regular check of the projector blending adjustment.", "resolution": "A new USB Dongle with its corresponding software license has been purchased. Once installed, the system will be recalibrated and the projector positions adjusted to restore optimal operating conditions.\n\nAdditionally, the preventive maintenance plan will be updated to include a new monthly task covering verification of blending status, presence and operation of the license USB Dongle, and checking of projector alignment and positioning, in order to prevent recurrence of this issue."}, {"id": "find_msr9w9m7h1uywb", "seq": 2, "title": "SUB.B2 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — a.6 Flight instruments in correct location", "category": "Hardware", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "In Progress", "description": "The PFD becomes detached from its correct position, which means that the lower part of the screen, with various data-presentation MENU options, cannot be seen properly because it is hidden by the bezel.", "resolution": "A technical intervention will be carried out to replace the current fastening system or implement an alternative solution that permanently ensures correct attachment of the screen. Although previous correction attempts have been made, they have not fully resolved the issue, so more robust fastening options will be evaluated.\n\nAs an additional preventive measure, informational signage has been placed next to the screen indicating that the device does not have touch functionality. This action aims to prevent students from mishandling the screen, thereby reducing the mechanical stress on the fastening system and minimizing the risk of recurrence."}, {"id": "find_msr9xonkz1v5ph", "seq": 3, "title": "SUB.B3 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — g.1 System operation", "category": "Software", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "During the stall-entry test, with a weight of approximately 2,600 lb and an altitude of 5,000 ft, the Stall Warning activates almost simultaneously with the actual stall, without the minimum required anticipation margin of at least 5 kt, both in clean configuration and with flaps in landing position. The stall warning only sounds with a more acceptable margin for the flaps-in-takeoff-position configuration:\n\n- Clean Configuration (FLAPS UP): Stall warning IAS 67 kt, Stall IAS 67 kt\n- FLAP Take Off: Stall warning IAS 64 kt, Stall IAS 64 kt\n- FLAP LANDING: Stall warning IAS 62 kt, Stall IAS 56 kt.\n\nThis same defect was already detected during the previous evaluation, and it was assumed to have been corrected based on the evidence submitted. It has malfunctioned again.\n\nAccording to MQTG test 2c(8b)1, performed at a weight of 2,700 lb and an altitude of 3,000 ft with Flaps UP and L/G down, the Stall Warning activates at a CAS of 70 kt and the minimum speed reached is CAS 60 kt.\n\nAccording to MQTG test 2c(8b)2, performed at a weight of 2,700 lb and an altitude of 3,000 ft with Flaps T/O and L/G down, the Stall Warning activates at a CAS of 66 kt and the minimum speed reached is CAS 59 kt.", "resolution": "A technical incident will be opened with the simulator manufacturer, providing the results obtained during the evaluation and reference to the requirements established in the applicable MQTG tests.\n\nThe manufacturer must analyze the configuration and parameterization of the stall-warning system, and review the modifications implemented during previous work related to correcting the QTG, in order to identify the origin of the discrepancy.\n\nOnce the technical cause is determined, the necessary corrections will be implemented and new functional and subjective tests will be carried out to verify that the Stall Warning activates with the anticipation required in all applicable flight configurations and within the tolerances established by the MQTG.\n\nAfter the intervention, the results of the verifications performed will be documented."}, {"id": "find_msr9ynuoiepvr9", "seq": 4, "title": "SUB.B4 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — i.1 Control forces corresponding to the replicated aircraft type", "category": "Hardware", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The force required to move the Roll control appears higher than would be expected for this type of aircraft, directly affecting control precision and pilot workload. Although according to the recurrent QTG 2a(2), the result matches the MQTG.", "resolution": "QTG test 2.a.(2), corresponding to the aileron control force, will be repeated on each affected simulator. Additionally, an independent manual measurement will be carried out using a dynamometer, verifying at least the force required to reach maximum deflection of the aileron control. The values obtained through manual measurement will be compared with the results recorded by the automatic QTG test, in order to validate the accuracy of the simulator's measurements and confirm that the control forces fall within acceptable tolerances.\n\nDepending on the results obtained: if the difference between both measurements is minimal and compatible with the established tolerances, closure will proceed. If significant deviations are detected, a technical incident will be opened with the manufacturer to investigate the origin of the problem."}, {"id": "find_msr9zhbqijh3yq", "seq": 5, "title": "SUB.C1 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — a.6 Switches functioning correctly", "category": "Hardware", "cls": "C", "kind": "Subjective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The Autopilot disconnect button on the control yoke does not work. To disconnect the AP, the AP-MASTER must be switched off, or the controls must be moved to override the AP's force.", "resolution": "An inspection of the system will be carried out to determine the exact origin of the fault, checking the condition of the button, the wiring, the connectors, and correct signal reception by the control system.\n\nOnce the cause has been identified, the defective components will be repaired or replaced. After the intervention, functional tests will be performed to confirm that the Autopilot disconnect button operates correctly and that disconnection occurs as expected."}, {"id": "find_msra0n8dqde4al", "seq": 6, "title": "SUB.C2 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — a.6 Instruments functioning correctly", "category": "Hardware", "cls": "C", "kind": "Subjective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "When the simulator is switched on, the EFIS STANDBY instrument appears off-center and is not displayed correctly. It is necessary to remove the simulator's forward cowling to access the instrument's electronic control board and reset it manually so that it displays correctly, then reinstall the cowling.\n\nThis defect was identified during the FSTD Organization's own most recent functional and subjective test, carried out on 24-04-2026, but was not recorded in the HIL at the time of the AESA inspection.", "resolution": "The incident will be formally reported to the simulator manufacturer so that it can carry out a technical analysis of the EFIS STANDBY instrument, its electronic control board, and the associated initialization procedures.\n\nThe manufacturer must identify the cause of the fault and propose a permanent solution that eliminates the need for manual resets via physical access to the hardware.\n\nOnce the correction has been implemented, repeated startup tests will be carried out to verify that the instrument initializes correctly every time and maintains a proper display without the need for manual intervention.\n\nThe fault will be reported in the HIL."}, {"id": "find_msra1obzq9gkyn", "seq": 7, "title": "OBJ.B1 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 1. General — e.3 Updated navigation database", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The last three updates of the Navigation Database have not been performed at the maximum three-month interval established by the regulation, as observed in the NAVDATA UPDATES — Changes Record log:\n\n- Cycle 2506 updated on 14/06/2025\n- Cycle 2510 updated on 15/10/2025, after 4 months had elapsed\n- Cycle 2602 updated on 12/02/2026, after 4 months had elapsed\n- Current cycle installed on 20/05/2026, after slightly more than 3 months had elapsed\n\nHowever, despite the above evidence, internal audit PVC-13, carried out on 10/04/2026, in question 3 of the FSTD-3 area of that audit, indicates that point \"2. Navigation databases are reviewed. Validity should not exceed 3 months\" is compliant.", "resolution": "The manufacturer will be formally notified of the need to ensure that Navigation Database updates are carried out within the deadlines established by the regulation, defining a communication and planning procedure that provides advance notice of scheduled update dates.\n\nAdditionally, the FSTD Organization will implement a specific internal control system to monitor the currency of NAVDATA. This control will include periodic review of the installation date and current AIRAC cycle, as well as the generation of preventive alerts as the maximum permitted limit approaches.\n\nLikewise, the internal audit program and the associated checklists will be reviewed to strengthen documentary verification of navigation database currency, preventing similar situations from going undetected during future audits."}, {"id": "find_msra2pv1sijje9", "seq": 8, "title": "OBJ.B2 — AMC1.FSTD(A).300 Qualification Basis — point (a)(ii)(I)(j): Validation Test Results", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "In the following recurrent QTGs, performed by the FSTD Organization in the cycle, the irregularities indicated below are observed:\n\n- Test 2c(1)1 Power Change Dynamics: the Bank Angle chart behaves incorrectly (\"CT&M\") relative to the approved MQTG result.\n- Test 2c(2)3 Flap Change Force TO and Test 2c(2)4 Flap Change Force APCH: the ELEV ANGL chart of the MQTG curve is not the same as the one shown on the approved MQTG.\n- Test 2c(4)1 Gear Change Dynamics TO: the Bank Angle chart behaves incorrectly (\"CT&M\") relative to the approved MQTG result.\n- Test 2c(5)1 Long Trim Cruise Cruise: the first snapshot has a small R/C of 16.29 ft/min, which is acceptable, but the second and third snapshots have an R/C > 100 ft/min in descent, when it should be level flight at constant altitude. In the MQTG, the values for snapshots 2 and 3 were acceptable.\n- In all three Test 2c(8b)x Approach-to-Stall tests, the force values at the moment of Stall Warning are missing.\n- Test 2d(1) Vmca during TO: the MQTG values are missing in one column, preventing comparison.", "resolution": "The affected QTGs will be repeated using the approved version of the MQTG and carefully verifying all data generated and transcribed in the corresponding records.\n\nThe new results will be independently reviewed to confirm whether the discrepancies detected correspond solely to documentary errors or whether there is any real deviation in the results obtained by the simulator.\n\nIn parallel, the manufacturer will be notified of the situation so that it can analyze the possible existence of errors in report generation, test templates, or software modifications that may have affected the presentation or integrity of the validation data.\n\nLikewise, the internal QTG execution and verification procedure will be reviewed in order to strengthen documentary quality controls prior to formal acceptance of results."}, {"id": "find_msra3kqlt3lfyk", "seq": 9, "title": "OBJ.B3 — AMC1.FSTD(A).300 Qualification Basis — point (a)(ii)(I)(j): Validation Test Results", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "In the following QTGs, repeated on 28-05-2026 during AESA's recurrent evaluation, the following irregularities are observed:\n\n- Test 1c(1) Normal Climb All Engines Operating: the \"Rate of Climb\" parameter is out of tolerance, below what is observed on the MQTG. In addition, the altitude at the start of the test is incorrect.\n- Test 2c(2)2 Flap Change Dynamics during Approach: the Bank Angle chart behaves incorrectly (\"CT&M\") relative to the approved MQTG result.\n- Test 2c(8b)2 Approach to Stall — Approach Configuration: the pitch control force value at the moment of Stall Warning does not appear.\n- Test 2c(9) Phugoid Dynamics during Cruise: the Bank Angle chart behaves incorrectly (\"CT&M\") relative to the approved MQTG result.\n- Test 2d(2)2 Roll Response Rate during Approach: the Calibrated Airspeed chart behaves incorrectly (\"CT&M\") relative to the approved MQTG result.\n- Test 2d(5)2 Engine Inoperative Trim — Approach: the column with the MQTG results does not appear. In the recurrent test performed by the FSTD Organization in the cycle, the column with the MQTG values does appear.", "resolution": "The manufacturer will be formally notified of the full set of discrepancies detected during the recurrent evaluation. A thorough review will be requested of the simulator configuration, the changes implemented during the most recent maintenance work, and the parameters associated with the affected QTG tests, with the aim of identifying possible side effects arising from previous modifications.\n\nThe affected QTGs will subsequently be repeated to verify that the detected discrepancies have been eliminated and to confirm that the results obtained are consistent with the approved MQTG reference values.\n\nAdditionally, the FSTD Organization will review its configuration-control and external-modification-tracking process to strengthen oversight of manufacturer changes and minimize the risk of recurrence of similar incidents."}, {"id": "find_msra4sf2avvgx7", "seq": 10, "title": "OBJ.B4 — AMC1.FSTD(A).300 Qualification Basis — point (a)(ii)(I)(j): Validation Test Results / AMC1.FSTD(A).300 point (a)(6) MQTG Content", "category": "Documentation", "cls": "B", "kind": "Objective", "deviceId": "dev_msr9o7w9uqym5s", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "During the evaluation of the Major Modification for the HW & SW change requested by the FSTD Organization in 2025 (see AESA file FSTD 0116-2025 MOD-2025-13), discrepancy OBJ.B3 was already detected, noting that the MQTG did not include, in the various Test 2.c.(8b).X of Approach-to-Stall, the pitch control force result at the moment the Stall Warning activates.\n\nAccording to the documentation submitted by the FSTD Organization via the Electronic Registry Office on 01/09/2025, which included a new corrected version of the MQTG, that new version showed that discrepancy OBJ.B3 had been corrected, as the pitch control force value at the moment of Stall Warning was now included.\n\nHowever, in the latest version of the MQTG sent to AESA via a download link through an email sent on 07/10/2025 — the version ultimately approved by AESA, a copy of which the FSTD Organization holds — the pitch control force value at the moment of Stall Warning has once again disappeared from that version.", "resolution": "A technical clarification will be requested from the manufacturer regarding the changes made and the justification for the disappearance of this data in the recurrent version.\n\nAdditionally, the internal documentary-control and configuration-management procedure will be reviewed to strengthen traceability of future modifications and to ensure that corrected discrepancies do not reappear in later versions of the documentation."}, {"id": "find_msra60iesnv293", "seq": 11, "title": "SUB.B1 — Appendix 1 CS-FSTD(A).300 FSTD Standards — 3. Visual System — d.1 Visual system free of discontinuities", "category": "Visual System", "cls": "B", "kind": "Subjective", "deviceId": "dev_msr9op3dkztifr", "authority": "AESA", "dateRaised": "2026-06-22", "dueDate": "2026-08-24", "status": "Open", "description": "The visual system does not have the projector \"blending/overlap\" correctly adjusted, particularly between the projector covering the central and right areas of the screen, since a double image is visible. This effect causes confusion, especially during the approach phase with wind from the left, which results in the landing runway appearing within the overlap zone.\n\nThis same defect was already detected during the previous evaluation and was assumed to have been corrected based on the evidence submitted at the time. There is no evidence that the simulator's preventive maintenance procedures include a regular check of the projector blending adjustment.", "resolution": "A new USB Dongle with its corresponding software license has been purchased. Once installed, the system will be recalibrated and the projector positions adjusted to restore optimal operating conditions.\n\nAdditionally, the preventive maintenance plan will be updated to include a new monthly task covering verification of blending status, presence and operation of the license USB Dongle, and checking of projector alignment and positioning, in order to prevent recurrence of this issue."}, {"id": "find_msra6w501h1usz", "seq": 12,
